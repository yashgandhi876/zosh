<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZOSH · markets & money, private by design</title>
<meta name="description" content="ZOSH: history-based market analysis, mutual funds, IPOs, bonds and your own money in one place. Your data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZOSH">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky search bar; home = scan overview; stock = header tiles, "right now" cards, then evidence sections */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#f1f3f6; --fg:#0f172a; --muted:#64748b; --line:#e6e8ec; --line2:#eef0f3;
  --accent:#2563eb; --accent-fg:#ffffff; --accent-soft:#eaf1fe; --up:#15803d; --down:#dc2626; --warn:#b45309; --strong:#15803d; --mod:#2563eb;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06); --shadow-lg:0 12px 32px rgba(16,24,40,.12);
  --radius:12px; --radius-sm:8px; --side:248px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --code:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0e13; --surface:#11161d; --sunk:#171d26; --fg:#e6e9ef; --muted:#8b95a5; --line:#232a35; --line2:#1b222c;
  --accent:#5b8cff; --accent-fg:#0b1020; --accent-soft:#16233f; --up:#22c55e; --down:#f2555a; --warn:#f0b03f; --strong:#22c55e; --mod:#5b8cff;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --shadow:none; --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e13; --surface:#11161d; --sunk:#171d26; --fg:#e6e9ef; --muted:#8b95a5; --line:#232a35; --line2:#1b222c;
  --accent:#5b8cff; --accent-fg:#0b1020; --accent-soft:#16233f; --up:#22c55e; --down:#f2555a; --warn:#f0b03f; --strong:#22c55e; --mod:#5b8cff;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --shadow:none; --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--accent)}
.bar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em;font-size:1.05rem;cursor:pointer;display:flex;gap:8px;align-items:center}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.search{position:relative;flex:1;min-width:220px;max-width:520px}
.search input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.dd div{padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.dd .rr{margin-left:auto;flex-shrink:0}
.dd .rr span{padding:2px 6px}
.dd div:hover,.dd div.on{background:var(--sunk)}
.dd b{font-family:var(--mono);font-weight:500;min-width:110px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:.82rem;color:var(--muted);margin-left:auto}
main{max-width:1180px;margin:0 auto;padding:24px 20px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.9rem;letter-spacing:-.02em}
h2{font-size:1.15rem}
.sub{color:var(--muted);font-size:.9rem}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tile{background:var(--surface);padding:12px 14px}
.tile b{display:block;font-family:var(--mono);font-weight:500;font-size:1.2rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
th:first-child,td:first-child,td.l,th.l{text-align:left}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
.up{color:var(--up)} .down{color:var(--down)}
.chip{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.g-Strong{color:var(--strong)} .g-Moderate{color:var(--mod)} .g-Weak{color:var(--warn)} .g-No{color:var(--muted)} .g-Too{color:var(--muted)}
.i-high{color:var(--down)} .i-medium{color:var(--warn)} .i-low{color:var(--muted)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.card.bull{border-left:3px solid var(--up)} .card.bear{border-left:3px solid var(--down)} .card.neu{border-left:3px solid var(--muted)}
.card h3{font-size:1rem}
.card .meta{font-size:.84rem;color:var(--muted)}
.big{font-family:var(--mono);font-size:1.05rem}
.chart{position:relative;height:300px}
.chart.sm{height:140px}
.news{display:flex;flex-direction:column}
.news a.item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.news a.item:hover .t{text-decoration:underline}
.news .when{font-family:var(--mono);font-size:.75rem;color:var(--muted);min-width:86px}
.news .src{font-size:.78rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.claude{white-space:pre-wrap;line-height:1.6;max-width:75ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:200px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.err{color:var(--down);background:var(--sunk);border-radius:6px;padding:12px 14px}
.loading{color:var(--muted);display:flex;gap:10px;align-items:center}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.note{font-size:.8rem;color:var(--muted);max-width:90ch}

.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:10px 14px;border:none;border-bottom:2px solid transparent;background:none;border-radius:0;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
.mk{font-family:var(--mono);font-size:.66rem;padding:1px 5px;border-radius:3px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:middle}
.idx{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:20px;align-items:center}
@media (max-width:760px){.idx{grid-template-columns:1fr}}
.idx .lvl{font-family:var(--mono);font-size:1.8rem;font-variant-numeric:tabular-nums}
.mcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}
.mcols>*{min-width:0}
.mitem{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.mitem:hover .mname{text-decoration:underline}
.mhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mname{font-weight:600}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.mrow .k{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:62px}
.lean-bullish{color:var(--up)} .lean-bearish{color:var(--down)} .lean-mixed{color:var(--muted)}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 28px;font-size:.78rem;color:var(--muted)}
.g-Look{color:var(--accent)}
.act{display:inline-block;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.05em;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.act.BUY{color:var(--up)} .act.SELL{color:var(--down)}
.ls{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--sunk)}
.ls-Confirmed{color:var(--up)} .ls-Downgraded{color:var(--warn)} .ls-Suppressed{color:var(--down);text-decoration:line-through} .ls-Unchanged{color:var(--muted)}
.learn{font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.hit{color:var(--up);font-weight:600} .miss{color:var(--down);font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}
.bars div{display:grid;grid-template-columns:220px 1fr 40px;gap:10px;align-items:center;font-size:.86rem}
.bars i{display:block;height:10px;border-radius:2px;background:var(--accent)}
.conf{font-family:var(--mono);font-size:.7rem;padding:2px 6px;border-radius:3px;border:1px solid var(--accent);color:var(--accent)}
.conf.hi{background:var(--accent);color:var(--accent-fg)}
.cbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cbar select,.form input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input{width:140px}
.heat td{text-align:center;min-width:56px}
.size{font-size:.84rem;background:var(--sunk);border-radius:6px;padding:8px 10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.size b{font-family:var(--mono);font-weight:500;display:block}
.guide{max-width:860px;display:flex;flex-direction:column;gap:22px}
.guide h2{font-size:1.25rem}
.guide p,.guide li{max-width:72ch}
.guide ol,.guide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.guide .step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.guide .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.glos{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 16px;font-size:.9rem}
.glos dt{font-weight:600} .glos dd{margin:0;color:var(--muted)}
#tour{position:fixed;inset:0;z-index:100;pointer-events:none}
#tour .hole{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,15,12,.55);border:2px solid var(--accent);transition:all .2s;pointer-events:none}
#tour .tip{position:fixed;max-width:340px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.3);pointer-events:auto;display:flex;flex-direction:column;gap:10px}
#tour .tip h3{font-size:1rem}
#tour .tip p{margin:0;font-size:.9rem;line-height:1.5}
#tour .tip .row{justify-content:space-between}
@media (prefers-reduced-motion:reduce){#tour .hole{transition:none}}
.barright{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.barright .status{margin-left:0}
.lwc{position:relative;height:440px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 10px;background:var(--surface)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font-size:.86rem}
.evbox{font-size:.88rem;background:var(--sunk);border-radius:6px;padding:8px 12px;min-height:20px}
.heat2 td{text-align:center;font-family:var(--mono);font-size:.74rem;padding:5px 6px;min-width:46px}
.warn{background:color-mix(in srgb, var(--warn) 14%, transparent);border:1px solid var(--warn);border-radius:6px;padding:8px 12px;font-size:.88rem}
.helpbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);font-weight:600;border-radius:999px;padding:7px 14px 7px 8px;white-space:nowrap}
.helpbtn:hover{background:var(--accent);color:var(--accent-fg)}
.refbtn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-fg);border:1.5px solid var(--accent);font-weight:600;border-radius:999px;padding:7px 14px;white-space:nowrap}
.refbtn .ic{display:inline-block;font-size:1rem;line-height:1}
.refbtn.busy .ic{animation:s 1s linear infinite}
.refbtn:disabled{opacity:.85;cursor:progress}
body.static .refbtn{display:none}
.progbar{position:fixed;left:0;top:0;height:3px;background:var(--accent);z-index:30;transition:width .4s}
.helpbtn .q{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.helpbtn:hover .q{background:var(--accent-fg);color:var(--accent)}
@media (max-width:640px){.refbtn .lbl{display:none}.refbtn{padding:6px 9px}.bar-in{flex-wrap:nowrap}.search{min-width:0}.helpbtn{padding:6px}.helpbtn .lbl,.helpbtn{font-size:0}.helpbtn .q{font-size:.8rem}.barright .status{display:none}}
.plan{font-size:.84rem;line-height:1.5;color:var(--fg);background:var(--sunk);border-radius:6px;padding:8px 10px}
.verdict{display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--muted)}
.verdict.vb{border-left-color:var(--up)} .verdict.vs{border-left-color:var(--down)}
.verdict .vl{font-size:1.35rem;font-weight:700}
.demo{max-width:1200px;margin:0 auto;padding:8px 16px 0;font-size:.84rem;color:var(--muted)}
.demo b{color:var(--fg)}
body.static #mbtn,body.static #mmsg,body.static #ubtn,body.static [onclick^="runUni"],body.static [onclick^="lrun"],body.static [onclick*="confidence/train"],body.static [onclick*="experiments/run"],body.static [onclick*="ipo/run"],body.static section:has(#askq){display:none!important}

/* ---- filters / experiments ---- */
.fnote{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px}
.fnote .fx{color:var(--fg)} .fnote .ff{color:var(--down);font-weight:600}
.okc{color:var(--up)} .noc{color:var(--down)}
.exptab td.l{text-align:left;white-space:normal}
.exptab td.l:first-child{min-width:220px}
.vk{font-family:var(--mono);font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
.vk.Kept{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)} .vk.Rejected{background:var(--sunk);color:var(--muted)} .vk.Reference{background:var(--sunk);color:var(--fg)}
/* ---- risk / reward ---- */
.rr{display:inline-flex;border-radius:999px;overflow:hidden;font-size:.64rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.rr span{padding:2px 7px}
.rr .r-Low{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)} .rr .r-Medium{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)} .rr .r-High{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.rr .w-Low{color:var(--muted)} .rr .w-Medium{color:var(--mod);background:color-mix(in srgb,var(--mod) 10%,transparent)} .rr .w-High{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent);font-weight:700}
.rrgrid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:.74rem;max-width:420px}
.rrgrid div{padding:8px 6px;border-radius:6px;text-align:center;background:var(--sunk);color:var(--muted)}
.rrgrid .h{background:none;font-family:var(--mono);text-transform:uppercase;font-size:.64rem}
.rrgrid .on{background:var(--accent);color:var(--accent-fg);font-weight:700}
.rrgrid .good{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--up) 50%,transparent)} .rrgrid .bad{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--down) 40%,transparent)}
.rrwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px} @media (max-width:760px){.rrwrap{grid-template-columns:1fr}}
/* ---- IPOs ---- */
.mc.ipo{cursor:default} .mc.ipo:hover{transform:none;box-shadow:none}
.mc.Apply{--lc:var(--up)} .mc.Avoid{--lc:var(--down)} .mc.Neutral{--lc:var(--warn)} .mc.Too{--lc:var(--muted)}
.ipogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:14px}
.tl{display:flex;flex-wrap:wrap;gap:4px;font-size:.76rem}
.tl span{padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);font-family:var(--mono)}
.tl span.on{background:var(--accent);color:var(--accent-fg);font-weight:600} .tl span.done{text-decoration:line-through;opacity:.7}
.subbars{display:grid;grid-template-columns:max-content 1fr 64px;gap:4px 8px;align-items:center;font-size:.78rem}
.subbars .trk{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.subbars .fill{height:100%;background:var(--accent);border-radius:99px}
.subbars .val{font-family:var(--mono);text-align:right;font-weight:600}
.why{margin:0;padding-left:18px;font-size:.84rem;display:flex;flex-direction:column;gap:3px}
.segchip{font-family:var(--mono);font-size:.66rem;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.segchip.SME{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.ipotiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ipotiles>div{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.84rem;display:flex;flex-direction:column;gap:2px} .ipotiles b{display:block;font-size:1.15rem;font-family:var(--mono)}
/* ---- Matches cards ---- */
.mlist{display:flex;flex-direction:column;gap:12px}

// Line-for-line port of stockpatterns/incometax.py; tests/test_tax.py checks both.
// TAX-BEGIN
const TAX=(()=>{
const YEAR='2026-27',METRO_50=['Delhi','Mumbai','Kolkata','Chennai','Bengaluru','Hyderabad','Pune','Ahmedabad'];
const INF=Infinity,NEW=[[400000,0],[800000,.05],[1200000,.10],[1600000,.15],[2000000,.20],[2400000,.25],[INF,.30]];
const oldSlabs=age=>{const first=age==='80+'?500000:age==='60-80'?300000:250000;const o=[[first,0]];if(first<500000)o.push([500000,.05]);return o.concat([[1000000,.20],[INF,.30]])};
const slabTax=(inc,S)=>{let t=0,lo=0;for(const [hi,r] of S){if(inc>lo)t+=(Math.min(inc,hi)-lo)*r;lo=hi}return t};
const round10=x=>x>=0?Math.floor(x/10+0.5)*10:-round10(-x);
function surcharge(inc,tax,S,regime){let steps=[[50000000,.37],[20000000,.25],[10000000,.15],[5000000,.10]];if(regime==='new')steps=steps.slice(1);
  for(const [th,r] of steps)if(inc>th){const sc=tax*r;let below=slabTax(th,S);below+=surcharge(th,below,S,regime);return Math.max(0,Math.min(sc,below+(inc-th)-tax))}
  return 0}
const n=(d,k)=>{const v=+d[k];return isFinite(v)&&v>0?v:0};
function compute(inp,regime){const age=inp.age||'<60',senior=age==='60-80'||age==='80+',old=regime==='old',lines=[];
  const salBase=n(inp,'basic')+n(inp,'da'),hra=n(inp,'hra_received'),empNps=n(inp,'employer_nps');
  const gross=salBase+hra+n(inp,'other_allowances')+n(inp,'bonus')+empNps;
  let hraEx=0;if(old&&hra){const pct=METRO_50.includes(inp.city)?.5:.4;hraEx=Math.max(0,Math.min(hra,n(inp,'rent_paid')-.1*salBase,pct*salBase))}
  const oldEx=old?Math.min(n(inp,'old_exempt'),Math.max(0,gross-hraEx)):0;
  const std=gross?Math.min(gross,old?50000:75000):0,ptax=old?Math.min(n(inp,'professional_tax'),2500):0;
  const salary=Math.max(0,gross-hraEx-oldEx-std-ptax);
  lines.push(['Gross salary',gross],['HRA exemption',-hraEx],['Other exempt allowances',-oldEx],['Standard deduction',-std],['Professional tax',-ptax],['Income from salary',salary]);
  const nav=Math.max(0,n(inp,'rent_received')-n(inp,'municipal_tax')),letOut=.7*nav-n(inp,'letout_interest');
  const selfInt=old?Math.min(n(inp,'home_loan_interest'),200000):0;let hp=letOut-selfInt;if(hp<0)hp=old?Math.max(hp,-200000):0;
  lines.push(['Income from house property',hp]);
  const fam=n(inp,'family_pension'),famDed=Math.min(fam/3,old?15000:25000);
  const other=n(inp,'savings_interest')+n(inp,'deposit_interest')+n(inp,'other_income')+fam-famDed;
  lines.push(['Income from other sources',other]);
  const gti=Math.max(0,salary+hp+other);lines.push(['Gross total income',gti]);
  const ded={};const npsCap=((!old||inp.govt_employee)?.14:.10)*salBase;ded['Employer NPS (80CCD(2))']=Math.min(empNps,npsCap);
  if(old){ded['Section 123 (80C, PPF, ELSS, EPF, LIC...)']=Math.min(n(inp,'sec123'),150000);ded['Extra NPS (80CCD(1B))']=Math.min(n(inp,'nps_self_extra'),50000);
    const hs=(senior||inp.self_senior_spouse)?50000:25000,hpar=inp.parents_senior?50000:25000;
    ded['Health insurance (80D)']=Math.min(n(inp,'health_self'),hs)+Math.min(n(inp,'health_parents'),hpar);
    if(senior)ded['Deposit interest (80TTB)']=Math.min(n(inp,'savings_interest')+n(inp,'deposit_interest'),50000);
    else ded['Savings interest (80TTA)']=Math.min(n(inp,'savings_interest'),10000);
    ded['Education loan interest (80E)']=n(inp,'education_loan_interest');ded['Donations (80G)']=n(inp,'donation_100')+.5*n(inp,'donation_50');
    const dis={'40':75000,'80':125000};ded['Disability (80U)']=dis[String(inp.disability_self||'')]||0;ded['Dependent with disability (80DD)']=dis[String(inp.disability_dependent||'')]||0;
    ded['Medical treatment (80DDB)']=Math.min(n(inp,'medical_80ddb'),senior?100000:40000);
    if(!hra&&n(inp,'rent_paid')){const adj=Math.max(0,gti-Object.values(ded).reduce((a,b)=>a+b,0));ded['Rent paid, no HRA (80GG)']=Math.max(0,Math.min(60000,.25*adj,n(inp,'rent_paid')-.1*adj))}}
  const totDed=Math.min(gti,Object.values(ded).reduce((a,b)=>a+b,0));for(const [k,v] of Object.entries(ded))if(v)lines.push([k,-v]);
  const income=round10(gti-totDed),S=old?oldSlabs(age):NEW,tax=slabTax(income,S);let rebate=0;
  if(old&&income<=500000)rebate=Math.min(tax,12500);else if(!old)rebate=income<=1200000?Math.min(tax,60000):Math.max(0,tax-(income-1200000));
  const after=tax-rebate,sc=after?surcharge(income,after,S,regime):0,cess=.04*(after+sc),total=round10(after+sc+cess);
  return {regime,total_income:income,slab_tax:tax,rebate,surcharge:sc,cess,tax:total,lines,deductions:totDed,hra_exempt:hraEx,marginal_rate:marginal(income,S)}}
function marginal(inc,S){for(const [hi,r] of S)if(inc<=hi)return r;return S[S.length-1][1]}
function compare(inp){const nw=compute(inp,'new'),od=compute(inp,'old');return {new:nw,old:od,better:nw.tax<=od.tax?'new':'old',saving:Math.abs(nw.tax-od.tax),tax_year:YEAR}}
return {compute,compare,YEAR,METRO_50};
})();

const CALC=(()=>{

const INDIA_COSTS={customs_duty_pct:6.0,gst_pct:3.0,making_charge_pct:8.0,etf_expense_pct:0.5,sgb_interest_pct:2.5,physical_buyback_discount_pct:3.0};
function landedCost(spot,mode='physical',costs=null){

  else if(mode==='sgb'){entry=spot;exit=spot;recurring=-c.sgb_interest_pct/100}

  return {mode,spot:r(spot,4),entry:r(entry,4),exit:r(exit,4),entry_premium_pct:r((entry/spot-1)*100,3),exit_discount_pct:r((1-exit/spot)*100,3),
    annual_drag_pct:r(recurring*100,3),breakeven_move_pct:r(be*100,3),
    note:mode==='physical'?'Physical bullion has the highest round trip; an ETF is cheapest for trading; an SGB pays a coupon but is illiquid and has a long lock-in.':'Charges are indicative - check your own jeweller, broker or the RBI issue.'}}
function dilution(own,rounds,start=1e6){
  if(!(own>0&&own<=100))return {error:'ownership_pct must be between 0 and 100'};
  let total=start;const mine=start*own/100;const path=[{round:'start',pre_money:null,raise:null,new_investor_pct:null,your_pct:r(own,4)}];
  for(const x of rounds){if(x.pre_money<=0||x.raise_amount<0)return {error:`round '${x.name}' has a non-positive pre-money valuation`};
    if(x.option_pool_pct){let tp=total*x.option_pool_pct/100;tp/=Math.max(1e-9,1-x.option_pool_pct/100);total+=Math.max(0,tp)}
    const price=x.pre_money/total,ns=price>0?x.raise_amount/price:0,inv=ns/(total+ns)*100;total+=ns;
    path.push({round:x.name,pre_money:r(x.pre_money,2),raise:r(x.raise_amount,2),price_per_share:r(price,6),new_investor_pct:r(inv,4),your_pct:r(mine/total*100,4)})}

function safe(amount,cap,kind='post',disc=0,next=null,other=0){
  if(!(amount>0&&cap>0))return {error:'amount and cap must be positive'};if(kind!=='post'&&kind!=='pre')return {error:"kind must be 'post' or 'pre'"};
  const capPct=amount/cap*100,lines={cap:r(capPct,4)};let dOut=null;

    note:kind==='post'?'A post-money SAFE fixes your ownership, so later SAFEs dilute the founders rather than you. Pre-money SAFEs dilute each other.':'Pre-money SAFEs dilute each other; the earlier ones do better.'}}
function prefsOf(H){const p={};for(const h of H)if(h.is_preferred)p[h.name]=h.pref_multiple*h.invested;return p}
function allocate(proceeds,H,conv){const prefs=prefsOf(H),paid={};for(const h of H)if(h.is_preferred&&!conv.has(h.name))paid[h.name]=prefs[h.name];

  const rows=H.map(h=>{const p=pay[h.name]||0;return {name:h.name,shares:h.shares,share_pct:ts?r(h.shares/ts*100,4):null,invested:h.invested,payout:r(p,2),

let sel=-1,results=[],t0;
$('#q').addEventListener('input',e=>{clearTimeout(t0);const v=e.target.value;if(!v.trim()){$('#dd').hidden=true;return}

$('#q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){sel=Math.min(sel+1,results.length-1);drawDD();e.preventDefault()}

const FNAME={rs_ok:'weak relative strength',regime_ok:'market regime against it',no_edge:'SELL signals showed no edge on unseen years, so treat this as a caution, not a short'};
function fbox(f){if(!f)return '';const L=[];
  const fl=(f.failed||[]).filter(x=>x!=='no_edge');if((f.failed||[]).includes('no_edge'))L.push(`<span class="ff">Caution only: SELL signals showed no edge on unseen years, so this isn't a short or a sell call.</span>`);
  if(fl.length)L.push(`<span class="ff">Skipped by tested filter: ${fl.map(x=>FNAME[x]||x).join(' and ')}.</span>`);
  (f.notes||[]).forEach((n,i)=>{const key=i===0?'rs_ok':'regime_ok',ok=(f.active||[]).includes(key)?f[key]:null;L.push(`<span>${ok===true?'<b class="okc">✓</b>':ok===false?'<b class="noc">✗</b>':'·'} ${esc(n)}</span>`)});
  if(f.exit_text)L.push(`<span class="fx"><b>Exit plan:</b> ${esc(f.exit_text)}</span>`);
  return L.length?`<div class="fnote">${L.join('')}</div>`:''}

const fdate=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'–';
function ipoCard(r,today){
  const call=r.call||'Too early',cc=call.split(' ')[0];

  const sub=r.subscription||{};const cats=['QIB','NII','Retail','Total'].filter(k=>sub[k]!=null);
  const bar=v=>Math.min(100,Math.round(Math.log10(1+v)/Math.log10(201)*100));

  const S=r.similar||{};

  const news=(r.news||[]).slice(0,4);
  return `<div class="mc ipo ${cc}"><div class="mc-h"><span class="mc-t">${esc(r.name)}</span><span class="segchip ${r.segment}">${esc(r.segment==='SME'?r.exchange||'SME':'Mainboard')}</span><span class="mc-n">${esc(r.industry||'')}</span>${STATIC?'':`<span class="vpill ${call==='Neutral'||call==='Too early'?'watch':''}">${esc(STATIC?({Apply:'History favourable',Avoid:'History weak',Neutral:'History mixed'}[call]||'Too early'):(call==='Apply'?'Apply (history favours)':call==='Avoid'?'Avoid':call==='Neutral'?'Neutral':'Too early'))}</span>`}</div>
    <div class="tl">${tl}</div>
    <div class="pstats">
      <div class="ps"><span>Price</span><b>${r.price!=null?'₹'+num(r.price,0):'–'}</b><i>${(()=>{const n=(r.price_band||r.price_range||'').match(/\d+(\.\d+)?/g)||[];return n.length>1&&n[0]!==n[1]?'band ₹'+n[0]+'–'+n[1]:''})()}</i></div>
      <div class="ps"><span>1 lot</span><b>${r.lot!=null?num(r.lot,0):'–'}</b><i>${r.min_invest?lakh(r.min_invest):''}</i></div>
      <div class="ps"><span>Issue size</span><b>${r.size_cr!=null?'₹'+num(r.size_cr,0)+' Cr':'–'}</b></div>
      <div class="ps"><span>GMP</span><b class="${cls(r.gmp_pct)}">${r.gmp!=null?'₹'+num(r.gmp,1):'–'}</b><i>${r.gmp_pct!=null?pct(r.gmp_pct,1):''}${r.gmp_low!=null&&r.gmp_high!=null&&(r.gmp_low||r.gmp_high)?` · range ${num(r.gmp_low,0)}–${num(r.gmp_high,0)}`:''}</i></div>
      <div class="ps"><span>Est. listing</span><b>${r.est_listing?'₹'+num(r.est_listing,1):'–'}</b><i>price + GMP</i></div>
    </div>
    ${subs}
    <div class="sig"><div class="sig-h"><b>${STATIC?'What similar past IPOs did':'Why this call'}</b>${!STATIC&&r.p_up!=null?`<span class="sub" style="margin-left:auto">${cmeter(r.p_up,0.75)}</span>`:''}</div><ul class="why">${(r.reasons||[]).filter(x=>!STATIC||!/^model/i.test(x)).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${S.n?`<div class="sig-f"><span>Similar past IPOs: <b style="color:var(--fg)">${S.n}</b></span><span>·</span><span>closed listing day up <b style="color:var(--fg)">${pct(S.up,0,false)}</b></span><span>·</span><span>median <b class="${cls(S.median)}">${pct(S.median,0)}</b></span>${S.big_loss!=null?`<span>·</span><span>fell over 10%: ${pct(S.big_loss,0,false)}</span>`:''}</div>`:''}</div>
    ${ex}
    ${news.length?`<div class="news">${news.map(n=>`<a class="item" href="${esc(n.link)}" target="_blank" rel="noopener"><span class="when">${ago(n.published)}</span><span>${n.impact!=='low'?`<span class="chip i-${esc(n.impact)}">${esc(n.impact)}</span> `:''}<div class="t">${n.direction==='positive'?'<span class="up">▲</span> ':n.direction==='negative'?'<span class="down">▼</span> ':''}${esc(n.title)}</div><div class="src">${esc(n.source)}</div></span></a>`).join('')}</div>`:'<div class="sub" style="font-size:.8rem">No news in the last 10 days.</div>'}
    <div class="note" style="margin:0">${r.lead_managers?'Lead managers: '+esc(r.lead_managers)+'. ':''}${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">GMP source</a>`:''}</div></div>`}

// ---------- Matches cards ----------
const KIND={trigger:'Today',forming:'Forming',analog:'Look-alike'};
function wbar(label,me,base,color){return `<div class="wbar" style="--lc2:${color}"><span class="lbl">${label}</span><div class="trk"><div class="fill me" style="width:${Math.round((me||0)*100)}%"></div></div><span class="val">${pct(me,0,false)}</span><span class="lbl">Normal day</span><div class="trk"><div class="fill base" style="width:${Math.round((base||0)*100)}%"></div></div><span class="val" style="color:var(--muted);font-weight:400">${pct(base,0,false)}</span></div>`}
function cmeter(c,th){if(c==null||STATIC)return '';const hi=th!=null&&c>=th;return `<span class="cmeter ${hi?'hi':''}" title="Confidence model score${th!=null?' (target threshold '+Math.round(th*100)+'%)':''}">conf <span class="trk"><span class="fill" style="display:block;width:${Math.round(c*100)}%"></span></span>${Math.round(c*100)}%</span>`}
function sigBlock(i,th){const kind=i.kind==='trigger'?'trigger':i.kind==='forming'?'forming':'analog';const p=i.plan;
  const col=i.bias==='bearish'?'var(--down)':'var(--up)';
  const upTxt=i.bias==='bearish'?`Fell after ${i.horizon}d`:`Rose after ${i.horizon}d`;
  const me=i.bias==='bearish'&&i.win!=null?1-i.win:i.win,base=i.bias==='bearish'&&i.base_win!=null?1-i.base_win:i.base_win;
  const stats=p?`<div class="pstats">
      <div class="ps"><span>${STATIC?(kind==='trigger'?'Past direction':'If it fires, past'):(kind==='trigger'?'Action':'If it fires')}</span><b class="${p.action==='BUY'?'up':'down'}">${dirTxt(p.action)}</b></div>
      <div class="ps"><span>Hold</span><b>${p.hold_days}d</b><i>~${Math.round(p.hold_days/DPM*10)/10} months</i></div>
      <div class="ps"><span>Median</span><b class="${cls(p.median)}">${pct(p.median)}</b><i>normal ${pct(p.normal_median)}</i></div>
      <div class="ps"><span>Worked</span><b>${pct(p.win,0,false)}</b><i>of ${p.n} cases</i></div>
      <div class="ps"><span>Usual dip</span><b class="down">${pct(p.typical_dip)}</b><i>1 in 5: ${pct(p.bad_dip)}</i></div>
    </div>`:'';
  const lt=i.learning;const learn=lt?`${lchip(lt)}${lt.status!=='Unchanged'?` <span>→ ${pct(lt.adjusted,0,false)} after learning</span>`:''}`:'';
  const foot=[cmeter(i.confidence,th),learn,p&&p.exit_by&&kind==='trigger'?`<span>exit around <b style="color:var(--fg)">${esc(p.exit_by)}</b></span>`:''].filter(Boolean).join('<span>·</span>');
  return `<div class="sig ${kind}"><div class="sig-h"><span class="kind ${kind}">${KIND[kind]}</span>${arrow(i.bias)} <b>${esc(i.pattern_name)}</b> ${gchip(i.grade)}<span class="sub" style="margin-left:auto;font-size:.76rem">${i.n} past cases</span></div>
    ${i.forming_text?`<div class="sub" style="font-size:.8rem">${esc(i.forming_text)}</div>`:''}
    ${wbar(upTxt,me,base,col)}${stats}${foot?`<div class="sig-f">${foot}</div>`:''}${fbox(i.filters)}</div>`}
function matchCard(e,th){DPM=mktOf(e.symbol)==='CRYPTO'?30:21;const v=e.verdict||e.lean;const watch=/watch/i.test(v);
  return `<div class="mc ${esc(e.lean)}" onclick="${link(e.symbol)}"><div class="mc-h"><span class="mc-t">${esc(e.display)}</span><span class="mc-n">${esc(e.name)}</span>${rrChip(e.rr)}<span class="vpill ${watch?'watch':''}">${esc(vtxt(v))}</span><span class="mc-p">${e.currency}${num(e.close)}</span></div>
    ${e.items.map(i=>sigBlock(i,th)).join('')}</div>`}

// ---------- Matches ----------
async function matchesView(){
  const m=$('#main');m.innerHTML='<div class="loading"><div class="spin"></div>Loading matches…</div>';
  let d,cf;try{[d,cf]=await Promise.all([api('/api/matches'),api('/api/confidence?target='+SET.target_hit)])}catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  const th=cf.threshold&&cf.threshold.reachable?cf.threshold.threshold:null;
  const passes=e=>e.items.some(i=>i.kind==='trigger'&&i.confidence!=null&&th!=null&&i.confidence>=th&&(i.learning||{}).status!=='Suppressed'&&(i.filters||{}).passes!==false);
  if(SET.high_conf_only){for(const k of ['India','US','Crypto','Funds'])if(d[k])d[k].items=d[k].items.filter(passes)}
  const nToday=['India','US','Crypto','Funds'].reduce((s,k)=>s+((d[k]&&d[k].items.filter(passes).length)||0),0);
  const cText=cf.error?esc(cf.error):!cf.threshold?'Confidence model not trained yet.':cf.threshold.reachable?`Signals scoring ≥ ${Math.round(th*100)}% were right <b>${pct(cf.threshold.precision,0,false)}</b> of the time on years the model hadn't seen (${cf.threshold.n.toLocaleString()} cases, ${pct(cf.threshold.coverage,1,false)} of all signals; the average signal was right ${pct(cf.base_rate,0,false)}). <b>${nToday}</b> stock${nToday===1?'':'s'} qualify today.`:`No setting reached ${Math.round(cf.target*100)}% on unseen years.${cf.threshold.best?` The best was <b>${pct(cf.threshold.best.precision,0,false)}</b> on ${cf.threshold.best.n} cases (score ≥ ${Math.round(cf.threshold.best.threshold*100)}%).`:''} Pick a lower target to see what is achievable.`;
  const col=(label,g)=>`<section class="panel"><div class="row" style="justify-content:space-between"><h2>${label==='India'?'India · NIFTY 50 + watchlist':label==='US'?'US · S&P 500 + watchlist':label==='Funds'?'Mutual funds · top direct-growth funds':'Crypto · top coins + watchlist'} <span class="mcount">${g?.items?.length||0} setups</span></h2><span class="sub">${g?.generated?'scanned '+esc(g.generated):'not scanned yet'}</span></div>
    ${g&&g.items.length?`<div class="mlist">${g.items.map(e=>matchCard(e,th)).join('')}</div>`:'<div class="empty">No stock currently matches a pattern with a proven record. Run the scan to refresh.</div>'}</section>`;
  m.innerHTML=`<header style="display:flex;flex-direction:column;gap:8px">
    <div class="eyebrow">Matches · swing trading, 1–3 month holds</div><h1>Stocks whose setup matches their own history</h1>
    <p class="sub" style="max-width:80ch">Each stock is checked against patterns that have a Moderate or Strong record in <i>that</i> stock: triggered on the latest close, one step from triggering, or a recent price path that closely matches past ones. Ranked by how strong and how well-tested the edge is.</p>
    <div class="row"><button class="primary" id="mbtn" onclick="runMatches()">Find matches now</button><span class="sub" id="mmsg">Updates India, US and crypto prices (new days only) and re-checks everything.</span></div></header>
  <section class="panel"><div class="cbar"><b>High-confidence mode</b><label>Target hit rate <select id="tgt">${[0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9].map(v=>`<option value="${v}" ${Math.abs(v-SET.target_hit)<1e-9?'selected':''}>${Math.round(v*100)}%</option>`).join('')}</select></label><label><input type="checkbox" id="hco" ${SET.high_conf_only?'checked':''}> Show only stocks that meet it</label></div><p class="sub" style="margin:0">${cText}</p></section>
  <div class="mlegend"><span><i style="background:var(--up)"></i>Buy side</span><span><i style="background:var(--down)"></i>Sell side</span><span><i style="background:var(--warn)"></i>Mixed / watch</span><span><span class="kind trigger">Today</span> triggered on the latest close</span><span><span class="kind forming">Forming</span> one step away</span><span><span class="kind analog">Look-alike</span> recent price path matches the past</span></div>
  <div class="mcols">${col('India',d.India)}${col('US',d.US)}${d.Crypto?col('Crypto',d.Crypto):''}${d.Funds?col('Funds',d.Funds):''}</div>
  <p class="note">"Today" = triggered on the latest close. "Forming" = one step away. "Shape" = the last 20 sessions closely resemble at least 8 past moments whose 20-day outcome differs from normal by 20 points or more. History is not a guarantee. Not investment advice.</p>`;
  $('#tgt').onchange=async e=>{await saveSettings({target_hit:+e.target.value});matchesView()};
  $('#hco').onchange=async e=>{await saveSettings({high_conf_only:e.target.checked});matchesView()};
  if(ST.job.running){$('#mbtn').disabled=true;watchJob(matchesView)}
}
async function runMatches(){const r=await api('/api/matches/run',{method:'POST'});if(!r.started){$('#mmsg').textContent=r.message;return}
  $('#mbtn').disabled=true;$('#mmsg').textContent='Scanning… the first S&P 500 run downloads full history once (several minutes); later runs only add new days.';await refreshStatus();watchJob(matchesView)}

async function loadCompare(tick,period){
  document.querySelectorAll('#cmpP button').forEach(b=>{b.classList.toggle('on',b.dataset.p===period);b.onclick=()=>loadCompare(tick,b.dataset.p)});
  let d;try{d=await api(`/api/compare?tickers=${encodeURIComponent(tick)}&period=${period}`)}catch(e){$('#cmpT').innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  const old=charts.find(x=>x.canvas&&x.canvas.id==='cCmp');if(old){old.destroy();charts.splice(charts.indexOf(old),1)}
  const pal=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'].map(css);const ln=css('--line');
  const labels=d.series[0]?.dates||[];
  charts.push(new Chart($('#cCmp'),{type:'line',data:{labels,datasets:d.series.map((s,i)=>{const m=new Map(s.dates.map((x,j)=>[x,s.values[j]]));return{label:s.name,data:labels.map(x=>m.get(x)??null),borderColor:pal[i%pal.length],borderWidth:i<3?2:1.3,borderDash:i>=3?[4,3]:[],pointRadius:0,spanGaps:true}})},
    options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{boxWidth:12}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8}},y:{grid:{color:ln},title:{display:true,text:'growth of 100'}}}}}));
  $('#cmpT').innerHTML=`<table><thead><tr><th class="l">Name</th><th>Total return</th><th>Volatility</th><th>Worst fall</th><th class="l">Risk / reward</th></tr></thead><tbody>${[...d.series].sort((a,b)=>b.total-a.total).map(s=>`<tr class="click" onclick="${link(s.ticker)}"><td class="l"><b>${esc(s.name)}</b></td><td class="${cls(s.total)}">${pct(s.total)}</td><td>${pct(s.vol,0,false)}</td><td class="down">${pct(s.max_dd,0)}</td><td class="l">${rrChip(s.rr)||'<span class="sub">index</span>'}</td></tr>`).join('')}</tbody></table><p class="note">All lines start at 100 on ${esc(d.start)}. Click a row to open it.</p>`;
}
async function runUni(key){const r=await api('/api/scan/run?u='+key,{method:'POST'});if(!r.started){$('#status').textContent=r.message;return}await refreshStatus();watchJob(()=>universeView(key));const b=$('#ubtn');if(b)b.disabled=true}
function sigTable(sig){if(!sig.length)return '<div class="empty">No graded patterns triggered on the latest close.</div>';
  return `<div class="tw"><table><thead><tr><th>Stock</th><th class="l">Pattern</th><th>Signal</th><th>Grade</th><th>Cases</th><th>Win 20d</th><th>Normal</th><th>Best hold</th><th>Median then</th><th>Learning</th><th>Close</th></tr></thead><tbody>${sig.map(x=>`<tr class="click" onclick="${link(x.symbol)}"><td><b>${esc(x.display)}</b><div class="sub">${esc(x.name)}</div></td><td class="l">${arrow(x.bias)} ${esc(x.pattern_name)}</td><td>${actChip(x.plan?.action)||'–'}</td><td>${gchip(x.grade)}</td><td>${x.n}</td><td><b>${pct(x.win,0,false)}</b></td><td class="sub">${pct(x.base_win,0,false)}</td><td>${x.plan?x.plan.hold_days+'d':'–'}</td><td class="${cls(x.plan?.median)}">${x.plan?pct(x.plan.median):'–'}</td><td>${x.learning?lchip(x.learning)+' '+pct(x.learning.adjusted,0,false):'–'}</td><td>${x.currency}${num(x.close)}</td></tr>`).join('')}</tbody></table></div>`}
function stockTable(st){const rows=[...st].sort((a,b)=>(b.graded_today*2+b.n_forming)-(a.graded_today*2+a.n_forming)||a.display.localeCompare(b.display));

let tourI=0;
function startTour(){tourI=0;let o=$('#tour');if(!o){o=document.createElement('div');o.id='tour';o.innerHTML='<div class="hole"></div><div class="tip" role="dialog" aria-live="polite"></div>';document.body.appendChild(o)}o.hidden=false;showStep()}
function endTour(){const o=$('#tour');if(o)o.hidden=true;try{localStorage.setItem('pd_tour_done','1')}catch(e){}}
async function showStep(){const s=TOUR[tourI];if(!s)return endTour();
  if(STATIC&&(PRED_ONLY.includes(s.go)||['#mbtn','#tgt','.mcols','#refAll'].includes(s.sel))){tourI++;return showStep()}
  if(s.go&&!location.hash.endsWith(s.go)){go(s.go);await new Promise(r=>setTimeout(r,900))}
  let el=document.querySelector(s.sel);const hole=$('#tour .hole'),tip=$('#tour .tip');
  if(el){el.scrollIntoView({block:'center',behavior:'instant'});const r=el.getBoundingClientRect();
    Object.assign(hole.style,{display:'block',left:r.left-6+'px',top:r.top-6+'px',width:r.width+12+'px',height:Math.min(r.height+12,innerHeight-20)+'px'});
    const below=r.bottom+200<innerHeight;tip.style.top=(below?r.bottom+14:Math.max(12,r.top-14-180))+'px';tip.style.left=Math.max(12,Math.min(r.left,innerWidth-360))+'px'}
  else{hole.style.display='none';tip.style.top='30%';tip.style.left='calc(50% - 170px)'}
  tip.innerHTML=`<div class="eyebrow">Step ${tourI+1} of ${TOUR.length}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p><div class="row"><button onclick="endTour()">Skip</button><span class="row" style="gap:6px">${tourI?'<button onclick="tourI--;showStep()">Back</button>':''}<button class="primary" onclick="tourI++;showStep()">${tourI===TOUR.length-1?'Done':'Next'}</button></span></div>`;
  tip.querySelector('.primary').focus()}
document.addEventListener('keydown',e=>{const o=$('#tour');if(!o||o.hidden)return;if(e.key==='Escape')endTour();if(e.key==='ArrowRight'){tourI++;showStep()}if(e.key==='ArrowLeft'&&tourI){tourI--;showStep()}});

const sn=n=>String(n||'').replace(/\s*[-–(]\s*(direct|regular|growth|dir\b|reg\b).*$/i,'')||n;
const INR=v=>{if(v==null)return '–';const r=Math.round(v);return (r<0?'-':'')+'₹'+Math.abs(r).toLocaleString('en-IN')};
const LAKH=v=>{if(v==null)return '–';const a=Math.abs(v),s=v<0?'-':'';return a>=1e7?s+'₹'+(a/1e7).toFixed(2)+' Cr':a>=1e5?s+'₹'+(a/1e5).toFixed(2)+' L':INR(v)};
const MSUB=[['overview','Overview'],['holdings','Holdings'],['funds','Mutual funds'],['loan','Loan & overdraft'],['tax','Tax'],['deposits','Deposits'],['goals','Goals'],['import','Import & accounts']];
const post=(u,b)=>api(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
function shareBars(obj,total){const e=Object.entries(obj||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);if(!e.length)return '<div class="empty">Nothing yet.</div>';
  return `<div class="bars">${e.map(([k,v])=>`<div title="${esc(k)}: ${INR(v)}"><span>${esc(k)}</span><i style="width:${Math.max(2,v/total*100)}%"></i><b class="sub">${Math.round(v/total*100)}%</b></div>`).join('')}</div>`}

function hlist(H){const L=[];
  H.filter(h=>(h.flags||[]).some(f=>f.severity==='high')).forEach(h=>L.push(`<li><b>${esc(h.display)}</b>: ${h.flags.filter(f=>f.severity==='high').map(f=>esc(f.flag)).join('; ')}</li>`));
  H.filter(h=>h.weight>0.15).forEach(h=>L.push(`<li><b>${esc(h.display)}</b> is ${pct(h.weight,0,false)} of everything here.</li>`));
  H.filter(h=>h.pnl_pct!=null&&h.pnl_pct<-0.4).forEach(h=>L.push(`<li><b>${esc(h.display)}</b> is down ${pct(-h.pnl_pct,0,false)} from your buy price. Would you buy it today at this price?</li>`));
  H.filter(h=>h.rr&&h.rr.risk==='High'&&h.rr.reward==='Low').forEach(h=>L.push(`<li><b>${esc(h.display)}</b>: big swings with weak typical returns compared with its peers.</li>`));
  return L.length?`<ul class="tight">${L.slice(0,10).join('')}</ul>`:'<div class="empty">Nothing stands out. Run "Check my holdings" for the filings check.</div>'}

const fdCalc=(P,r,y,comp=4,payout=false)=>{r/=100;if(payout)return{m:P,i:P*r*y};const m=P*Math.pow(1+r/comp,comp*y);return{m,i:m-P}};
async function safeView(){
  const m=$('#main');m.innerHTML='<div class="loading"><div class="spin"></div>Loading rates…</div>';
  let d;try{d=await api('/api/rates')}catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  const G=['Government','Market','Bank FD'],gname={Government:'Government schemes (post office, RBI)',Market:'Government bonds & T-bills (market)', 'Bank FD':'Bank fixed deposits'};
  let slab=+(localStorage.getItem('pd_slab')||30);
  const draw=()=>{const rows=g=>d.rows.filter(r=>r.group===g).sort((a,b)=>b.rate-a.rate);
    $('#rtab').innerHTML=G.map(g=>`<section class="panel"><h2>${gname[g]}</h2><div class="tw"><table><thead><tr><th class="l">Option</th><th>Rate</th><th>After tax at ${slab}%</th><th class="l">Tenure</th><th class="l">Worth knowing</th></tr></thead><tbody>
      ${rows(g).map(r=>`<tr><td class="l"><b>${esc(r.name)}</b></td><td><b>${num(r.rate,2)}%</b></td><td>${r.name==='RBI repo rate'?'–':num(r.tax_free?r.rate:r.rate*(1-slab/100),2)+'%'+(r.tax_free?' <span class="sub">tax-free</span>':'')}</td><td class="l">${esc(r.tenure)}</td><td class="l sub">${esc(r.notes)}${r.notes?'<br>':''}<span style="opacity:.8">As of ${esc(r.as_of)}${r.link?` · <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.source)}</a>`:''}</span></td></tr>`).join('')}</tbody></table></div></section>`).join('');
    calc();ladder()};
  const calc=()=>{const P=+$('#cp').value||0,r=+$('#cr').value||0,y=+$('#cy').value||0,po=$('#cpo').checked,x=fdCalc(P,r,y,4,po),tf=$('#ctf').checked,tax=tf?0:x.i*slab/100;
    $('#cout').innerHTML=`<div class="tiles"><div class="tile"><b>${INR(po?P+x.i:x.m)}</b><span>${po?'principal + interest paid out':'at maturity'}</span></div><div class="tile"><b>${INR(x.i)}</b><span>interest earned</span></div><div class="tile"><b class="down">${INR(tax)}</b><span>tax at ${tf?'0':slab}% (paid yearly on accrued interest)</span></div><div class="tile"><b>${pct(y?Math.pow((P+x.i-tax)/P,1/y)-1:0,2)}</b><span>yearly return after tax</span></div></div>`};
  const ladder=()=>{const A=+$('#la').value||0,n=Math.max(1,Math.min(10,+$('#ln').value||5)),rs=$('#lr').value.split(',').map(Number);const each=A/n;let tot=0;
    const L=[...Array(n)].map((_,i)=>{const y=i+1,r=rs[Math.min(i,rs.length-1)]||7,x=fdCalc(each,r,y);tot+=x.m;return{y,r,m:x.m}});
    $('#lout').innerHTML=`<div class="tw"><table><thead><tr><th class="l">Rung</th><th>Amount</th><th>Rate</th><th>Matures</th><th>At maturity</th></tr></thead><tbody>${L.map(l=>`<tr><td class="l">${l.y}-year</td><td>${INR(each)}</td><td>${num(l.r,2)}%</td><td>${new Date().getFullYear()+l.y}</td><td>${INR(l.m)}</td></tr>`).join('')}</tbody></table></div><p class="note">Every year one deposit matures: use it if you need cash, or roll it into a new ${n}-year deposit so the ladder keeps going and you keep locking in the longest (usually highest) rate. Total at maturity ${INR(tot)}.</p>`};
  m.innerHTML=`<header><div class="eyebrow">Bonds & FDs · rates checked ${esc(d.checked)}</div><h1>Safe money: what each option pays today</h1>
    <p class="sub" style="max-width:85ch">Fixed-income options side by side, with what's left after tax at your slab. Interest from FDs, bonds, NSC and T-bills is added to your income and taxed at your slab every year; PPF and Sukanya Samriddhi are tax-free. Rates change; confirm with the bank or RBI before you invest.</p></header>
    <div class="row"><span class="sub">Your tax slab</span><div class="seg" id="slab">${[0,5,10,15,20,30].map(s=>`<button data-s="${s}" class="${s===slab?'on':''}">${s}%</button>`).join('')}</div></div>
    <div id="rtab"></div>
    <div class="grid"><section class="panel"><h2>FD calculator</h2><div class="form"><label class="sub">Amount ₹<input id="cp" type="number" value="500000"></label><label class="sub">Rate %<input id="cr" type="number" step="0.05" value="7.5"></label><label class="sub">Years<input id="cy" type="number" step="0.5" value="5"></label><label class="sub chk"><input id="cpo" type="checkbox"> Pay interest out</label><label class="sub chk"><input id="ctf" type="checkbox"> Tax-free (PPF / SSY)</label></div><div id="cout"></div><p class="note">Bank FDs compound every quarter.</p></section>
    <section class="panel"><h2>FD ladder planner</h2><div class="form"><label class="sub">Total ₹<input id="la" type="number" value="1000000"></label><label class="sub">Rungs (years)<input id="ln" type="number" value="5" min="1" max="10"></label><label class="sub">Rates for 1, 2, 3… years<input id="lr" value="6.9,7.0,7.1,7.1,7.5"></label></div><div id="lout"></div></section></div>
    <p class="note">Small finance bank FDs pay more but deposit insurance (DICGC) covers only ₹5 lakh per person per bank. Government schemes and G-secs carry the government's guarantee. A G-sec's price falls if interest rates rise and you sell before maturity; held to maturity you get the stated yield.</p>`;
  ['cp','cr','cy','cpo','ctf'].forEach(i=>$('#'+i).oninput=calc);['la','ln','lr'].forEach(i=>$('#'+i).oninput=ladder);
  document.querySelectorAll('#slab button').forEach(b=>b.onclick=()=>{slab=+b.dataset.s;try{localStorage.setItem('pd_slab',slab)}catch(e){}document.querySelectorAll('#slab button').forEach(x=>x.classList.toggle('on',x===b));draw()});
  draw();
}

async function runAnyImport(file,box){box.innerHTML='<div class="loading"><div class="spin"></div>Reading the file in your browser…</div>';

  for(const u of P.unresolved.slice())if(u.kind==='mf'){const c=await resolveFundByName(u.name);if(c){u.ticker=c+'.MF';P.holdings.push(u);P.unresolved.splice(P.unresolved.indexOf(u),1)}}
  const src='file:'+file.name.replace(/\.[^.]+$/,'').slice(0,40);box.innerHTML=importPreviewHTML(P,file.name);
  $('#ipno').onclick=()=>{box.innerHTML=''};
  $('#ipgo').onclick=async()=>{document.querySelectorAll('.ufix').forEach(inp=>{const v=inp.value.trim().toUpperCase();if(!v)return;const u=P.unresolved[+inp.dataset.i];u.ticker=/^\d{5,6}$/.test(v)?v+'.MF':(v.includes('.')||v.endsWith('-USD')?v:v+'.NS');if(u.ticker.endsWith('.MF'))u.kind='mf';P.holdings.push(u)});
    try{const r=await post('/api/me/import_rows',{source:src,holdings:P.holdings.map(h=>({...h,source:src})),deposits:P.deposits});$('#ipmsg').innerHTML=`<b class="up">Imported ${r.imported} items.</b> <a href="#/money/holdings">See holdings</a>`;$('#ipgo').disabled=true}catch(e){$('#ipmsg').innerHTML=`<span class="down">${esc(e.message)}</span>`}}}

    <p class="sub" style="max-width:85ch">Every ${STATIC?'up/down pattern reading':'BUY/SELL signal'} is saved as a prediction. When its holding period ends, the app checks what actually happened. For each miss it looks for why: a market move, a one-day shock, trading against the trend, high volatility, results or news during the hold. Those outcomes adjust future signals. Patterns that keep failing are downgraded or set aside, and conditions that hurt a pattern become lessons. All of this runs on your Mac with no AI tokens.</p>

const WEALTHX=(()=>{
// value of one holding after `years`: current value plus a monthly contribution at the start of
// each month, growing at an effective yearly return r%, contribution rising step% every year
function project(value,sip,r,years,step){const i=(1+r/100)**(1/12)-1;let b=+value||0,p=+sip||0,inv=+value||0;const yearly=[];
  for(let y=1;y<=years;y++){for(let k=0;k<12;k++){b=(b+p)*(1+i);inv+=p}yearly.push([y,inv,b]);p*=1+(+step||0)/100}
  return {value:b,invested:inv,yearly}}
const cagr=(s,key)=>{const x=s&&s[key];if(!x||!x.values||x.values.length<24)return null;const v=x.values,n=v.length;return {r:((v[n-1]/v[0])**(12/(n-1))-1)*100,from:x.months[0],to:x.months[n-1],name:x.name}};
return {project,cagr};
})();

// ---------- money calculators (Plan & tax) ----------
// Pure arithmetic on assumptions the visitor sets, plus real history for "what if".
// Formulas live in CALCX so tests/test_money_calcs.py can check them; nothing leaves the browser.
// CALCX-BEGIN
const CALCX=(()=>{
const sipFV=(P,ra,n)=>{const i=ra/1200;return i?P*((1+i)**n-1)/i*(1+i):P*n};          // invested at the start of each month
const sipFor=(target,ra,n)=>{const f=sipFV(1,ra,n);return f?target/f:0};
const emi=(P,ra,n)=>{const i=ra/1200;return i?P*i*(1+i)**n/((1+i)**n-1):P/n};
function stepUp(P,step,ra,years){const i=ra/1200;let bal=0,inv=0,p=P;const rows=[];for(let y=1;y<=years;y++){for(let k=0;k<12;k++){bal=(bal+p)*(1+i);inv+=p}rows.push([y,inv,bal]);p*=1+step/100}return {value:bal,invested:inv,rows}}
function fd(P,ra,years,slab){const q=(1+ra/400)**4-1;let pre=P,post=P,tax=0;const rows=[];for(let y=1;y<=Math.ceil(years);y++){const f=Math.min(1,years-(y-1));const g=(1+q)**f-1;
  const ip=pre*g;pre+=ip;const ipo=post*g,t=ipo*slab/100;post+=ipo-t;tax+=t;rows.push([y,pre,post])}return {maturity:pre,afterTax:post,tax,rows}}
function rd(R,ra,months){let m=0;for(let j=1;j<=months;j++)m+=R*(1+ra/400)**(j/3);return {maturity:m,invested:R*months}}
function ppf(D,ra,years){let b=0;const rows=[];for(let y=1;y<=years;y++){b=(b+D)*(1+ra/100);rows.push([y,D*y,b])}return {maturity:b,invested:D*years,rows}}
function ssy(D,ra){let b=0;const rows=[];for(let y=1;y<=21;y++){if(y<=15)b+=D;b*=1+ra/100;rows.push([y,D*Math.min(y,15),b])}return {maturity:b,invested:D*15,rows}}
function epf(basic,growth,ra,years,start){let b=start,B=basic,inv=0;const rows=[];for(let y=1;y<=years;y++){let int=0;
  const eps=B<=15000?.0833*B:1250,c=.12*B+(.12*B-eps);for(let k=0;k<12;k++){b+=c;inv+=c;int+=b*ra/1200}b+=int;rows.push([y,inv+start,b]);B*=1+growth/100}return {corpus:b,contributed:inv,rows}}
function nps(P,step,ra,years,annuityPct,annuityRate){const s=stepUp(P,step,ra,years);const ann=s.value*annuityPct/100;
  return {corpus:s.value,invested:s.invested,lumpsum:s.value-ann,annuity:ann,pension:ann*annuityRate/1200,rows:s.rows}}
function retirement(o){const {age,retire,life,expense,inflation,pre,post,saved}=o,yr=retire-age,L=life-retire;
  const A=expense*12*(1+inflation/100)**yr,r=post/100,f=inflation/100;
  const corpus=Math.abs(r-f)<1e-9?A*L:A*(1-((1+f)/(1+r))**L)/(r-f)*(1+r);
  const grown=saved*(1+pre/100)**yr,need=Math.max(0,corpus-grown);
  return {yearlyAtRetirement:A,corpus,grown,need,sip:sipFor(need,pre,yr*12)}}
function swp(C,W,ra,stepPct){let b=C,w=W,m=0,paid=0;const i=ra/1200;while(b>0&&m<1200){if(m&&m%12===0)w*=1+stepPct/100;const t=Math.min(w,b);b-=t;paid+=t;b*=1+i;m++}return {months:b>0?Infinity:m,paid,left:b>0?b:0}}
function loan(P,ra,years,paidMonths,prepay,extra){const n=Math.round(years*12),E=emi(P,ra,n),i=ra/1200;
  let b=P,base=0;for(let k=0;k<n;k++){const it=b*i;base+=it;b-=E-it}
  b=P;let int=0,m=0;for(;m<paidMonths&&b>0.5;m++){const it=b*i;int+=it;b-=E-it}
  b-=Math.min(prepay,b);let after=0;for(;b>0.5&&m<n*2;m++){const it=b*i;int+=it;const pay=Math.min(b+it,E+extra);b-=pay-it}
  return {emi:E,totalInterest:base,newInterest:int,saved:base-int,months:m,monthsSaved:n-m}}
function irr(flows){let lo=-0.99,hi=10;const npv=r=>flows.reduce((a,[t,c])=>a+c/(1+r)**t,0);if(npv(lo)*npv(hi)>0)return null;for(let k=0;k<200;k++){const mid=(lo+hi)/2;if(npv(lo)*npv(mid)<=0)hi=mid;else lo=mid}return (lo+hi)/2}
return {sipFV,sipFor,emi,stepUp,fd,rd,ppf,ssy,epf,nps,retirement,swp,loan,irr};
})();

    out.rule=a[2]==='slab'?'Debt funds bought from April 2023 are taxed at your slab rate however long you hold them.':(a[2]==='equity'?'Short-term (held 12 months or less): 20%.':`Short-term (held ${a[1]} months or less): taxed at your slab rate.`);return out}
  if(a[2]==='equity'){const free=Math.max(0,125000-(+o.used||0)),taxable=Math.max(0,gain-free);out.rate=.125;out.taxable=taxable;out.tax=taxable*.125*1.04;
    out.rule=`Long-term: 12.5% on gains above ₹1,25,000 a year (₹${Math.round(Math.min(free,gain)).toLocaleString('en-IN')} of this gain is tax-free).`;return out}
  out.rate=.125;out.taxable=gain;out.tax=gain*.125*1.04;out.rule='Long-term: 12.5% without indexation.';
  if(a[2]==='property'&&o.buy<'2024-07-23'&&o.resident!=='no'){const fb=Math.max(2001,fyStart(o.buy)),fs=fyStart(o.sell);
    if(CII[fb]&&CII[fs]){const ic=(+o.cost||0)*CII[fs]/CII[fb]+(+o.improve||0)*CII[fs]/CII[Math.max(2001,fyStart(o.improve_date||o.buy))];const ig=Math.max(0,sale-ic),it=ig*.20*1.04;
      out.indexed={cost:ic,gain:ig,tax:it,cii:[CII[fb],CII[fs]]};
      if(it<out.tax){out.tax=it;out.taxable=ig;out.rate=.20;out.rule=`Bought before 23 July 2024, so you may choose 20% with indexation (cost indexed ${CII[fb]} → ${CII[fs]}); it is lower here.`}
      else out.rule+=` (20% with indexation would be ₹${Math.round(it).toLocaleString('en-IN')}, so 12.5% is lower.)`}}
  return out}
function advanceTax(o){const net=Math.max(0,(+o.tax||0)-(+o.tds||0));
  if(o.senior==='yes')return {net,due:[],note:'A resident aged 60 or more with no business or professional income does not pay advance tax; pay any balance as self-assessment tax before filing.'};
  if(net<10000)return {net,due:[],note:'Advance tax applies only when tax still due after TDS is ₹10,000 or more for the year.'};
  const sched=o.presumptive==='yes'?[['15 March 2027',1]]:[['15 June 2026',.15],['15 September 2026',.45],['15 December 2026',.75],['15 March 2027',1]];
  let paid=0;const due=sched.map(([d,c])=>{const amt=net*c-paid;paid=net*c;return [d,c,amt,net*c]});return {net,due,note:'Short or late payment costs simple interest of 1% a month on the shortfall. Seniors without business income and taxpayers whose net tax is under ₹10,000 are exempt.'}}

  if(o.covered==='yes'){const y=yrs+(mo>6?1:0);amt=15/26*sal*y;how=`15/26 × ₹${Math.round(sal).toLocaleString('en-IN')} × ${y} years (more than 6 months counts as a full year)`}
  else{amt=15/30*sal*yrs;how=`15/30 × average salary of the last 10 months × ${yrs} completed years`}
  const paid=+o.paid||amt;let exempt;if(o.govt==='yes')exempt=paid;else exempt=Math.max(0,Math.min(paid,amt,2000000-(+o.prior||0)));
  return {formula:amt,paid,exempt,taxable:Math.max(0,paid-exempt),how}}
