async function learningView(){
  const m=$('#main');m.innerHTML='<div class="loading"><div class="spin"></div>Loading what the app has learned…</div>';
  let d;try{d=await api('/api/learning')}catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  const M=d.memory||{},bs=M.by_source||{},rs=M.reasons||{},rmax=Math.max(1,...Object.values(rs));
  m.innerHTML=`<header style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">Learning</div><h1>Did the predictions come true?</h1>
    <p class="sub" style="max-width:85ch">Every ${STATIC?'up/down pattern reading':'BUY/SELL signal'} is saved as a prediction. When its holding period ends, the app checks what actually happened. For each miss it looks for why: a market move, a one-day shock, trading against the trend, high volatility, results or news during the hold. Those outcomes adjust future signals. Patterns that keep failing are downgraded or set aside, and conditions that hurt a pattern become lessons. All of this runs on your Mac with no AI tokens.</p>
    <div class="row"><button class="primary" onclick="lrun('check')">Check outcomes now</button><button onclick="lrun('replay')">Replay last 7 years</button><span class="sub" id="lmsg">${M.updated?'Last updated '+esc(M.updated):'Nothing checked yet. Run the replay to give the app two years of real, out-of-sample memory to start with.'}</span></div></header>
  <div class="tiles">
    <div class="tile"><b>${M.n||0}</b><span>predictions checked</span></div>
    <div class="tile"><b class="${(M.hit_rate||0)>=(M.expected||1)?'up':'down'}">${M.n?pct(M.hit_rate,0,false):'–'}</b><span>came true (expected ${M.n?pct(M.expected,0,false):'–'})</span></div>
    <div class="tile"><b>${bs.live?bs.live.n:0}</b><span>live · ${bs.live?pct(bs.live.hit_rate,0,false)+' right':'none resolved yet'}</span></div>
    <div class="tile"><b>${bs.replay?bs.replay.n:0}</b><span>replayed · ${bs.replay?pct(bs.replay.hit_rate,0,false)+' right':'not run'}</span></div>
    <div class="tile"><b>${M.open||0}</b><span>still open</span></div>
    <div class="tile"><b>${(M.lessons||[]).length}</b><span>lessons learned</span></div>
  </div>
  <div class="grid">
    <section class="panel"><h2>Lessons learned</h2>${(M.lessons||[]).length?`<div class="news">${M.lessons.map(l=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${esc(l.text)} <span class="sub">Future signals in that condition are lowered by ${Math.round(l.penalty*100)} points.</span></div>`).join('')}</div>`:'<div class="empty">No lesson yet. A lesson needs at least 8 checked predictions of a pattern, with at least 4 cases inside and outside the condition, and a hit rate at least 20 points lower inside it.</div>'}</section>
    <section class="panel"><h2>Why predictions missed</h2>${Object.keys(rs).length?`<div class="bars">${Object.entries(rs).map(([k,v])=>`<div><span>${esc(REASONS[k]||k)}</span><i style="width:${Math.round(100*v/rmax)}%"></i><span class="sub">${v}</span></div>`).join('')}</div><p class="note">One miss can have several reasons.</p>`:'<div class="empty">No misses checked yet.</div>'}</section>
  </div>
  <section class="panel" id="cfbox"><h2>Confidence model</h2><div class="loading"><div class="spin"></div></div></section>
  <section class="panel" id="expbox"><h2>Accuracy experiments</h2><div class="loading"><div class="spin"></div></div></section>
  <section class="panel"><h2>Track record by pattern</h2>${(M.by_pattern||[]).length?`<div class="tw"><table><thead><tr><th class="l">Pattern</th><th>Call</th><th>Market</th><th>Checked</th><th>Came true</th><th>Expected</th><th>Avg result</th><th class="l">Main miss reasons</th></tr></thead><tbody>${M.by_pattern.map(b=>`<tr><td class="l">${esc(b.pattern_name)}</td><td>${actChip(b.action)}</td><td>${{IN:'India',CRYPTO:'Crypto',MF:'Funds'}[b.market]||'US'}</td><td>${b.n}</td><td class="${b.hit_rate>=b.expected?'up':'down'}"><b>${pct(b.hit_rate,0,false)}</b></td><td class="sub">${pct(b.expected,0,false)}</td><td class="${cls(b.avg_realized)}">${pct(b.avg_realized)}</td><td class="l sub">${Object.entries(b.miss_reasons).sort((a,c)=>c[1]-a[1]).slice(0,3).map(([k,v])=>`${REASONS[k]||k} (${v})`).join(', ')}</td></tr>`).join('')}</tbody></table></div><p class="note">Avg result = average move in the predicted direction over the planned hold.</p>`:'<div class="empty">Nothing checked yet.</div>'}</section>
  <section class="panel"><h2>Recent outcomes</h2>${d.recent.length?`<div class="tw"><table><thead><tr><th class="l">Signal date</th><th class="l">Stock</th><th class="l">Pattern</th><th>Call</th><th>Hold</th><th>Result</th><th>Outcome</th><th class="l">Why (for misses)</th></tr></thead><tbody>${d.recent.map(r=>`<tr class="click" onclick="${link(r.ticker)}"><td class="l">${esc(r.date)}${r.source==='replay'?' <span class="mk">replay</span>':''}</td><td class="l"><b>${esc(r.ticker.replace(/\.NS$/,''))}</b></td><td class="l">${esc(r.pattern_name)}</td><td>${actChip(r.action)}</td><td>${r.hold_days}d</td><td class="${cls(r.realized)}">${pct(r.realized)}</td><td><span class="${r.status}">${r.status==='hit'?'Came true':'Missed'}</span></td><td class="l sub" style="white-space:normal;min-width:260px">${esc(r.reason_text||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No outcomes yet.</div>'}</section>
  <section class="panel"><h2>Open predictions</h2>${d.open.length?`<div class="tw"><table><thead><tr><th class="l">Signal date</th><th class="l">Stock</th><th class="l">Pattern</th><th>Call</th><th>Hold</th><th>Entry</th><th>Expected</th></tr></thead><tbody>${d.open.map(r=>`<tr class="click" onclick="${link(r.ticker)}"><td class="l">${esc(r.date)}</td><td class="l"><b>${esc(r.ticker.replace(/\.NS$/,''))}</b></td><td class="l">${esc(r.pattern_name)}</td><td>${actChip(r.action)}</td><td>${r.hold_days}d</td><td>${num(r.entry)}</td><td>${pct(r.exp_win,0,false)} chance · median ${pct(r.exp_median)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">New predictions are logged at each scan.</div>'}</section>`;
  if(ST.job.running)watchJob(learningView);
  api('/api/experiments').then(x=>{const b=$('#expbox');if(!b)return;
    const runBtn=`<div><button onclick="api('/api/experiments/run',{method:'POST'}).then(()=>{refreshStatus();watchJob(learningView)})">Re-run experiments</button></div>`;
    if(!x||!x.sides){b.innerHTML=`<h2>Accuracy experiments</h2><div class="empty">${esc((x&&x.error)||'Not run yet. They run after the replay and after each learning check.')}</div>${runBtn}`;return}
    const yrs=x.years||[];
    const row=(t,inUse)=>`<tr><td class="l"><b>${esc(t.label)}</b>${t.why?`<div class="sub" style="font-size:.76rem">${esc(t.why)}</div>`:''}</td><td>${(t.n||0).toLocaleString()}<div class="sub">${pct(t.share,0,false)}</div></td><td>${pct(t.win,1,false)}</td><td class="${cls(t.avg)}">${pct(t.avg,2)}</td><td class="${cls(t.edge)}"><b>${pct(t.edge,2)}</b></td><td>${pct(t.beat,0,false)}</td><td class="down">${pct(t.p10,1)}</td><td>${t.years_tested?t.years_better+' of '+t.years_tested:'–'}</td>${yrs.map(y=>{const v=(t.by_year||{})[y]||{};return `<td class="${cls(v.edge)}">${v.n?pct(v.edge,1):'–'}</td>`}).join('')}<td class="l"><span class="vk ${inUse?'Kept':t.verdict==='No edge'?'Rejected':t.verdict}">${inUse?'In use':esc(t.verdict)}</span></td></tr>`;
    const side=(k,v)=>`<h3 style="margin:6px 0 0">${k} signals <span class="sub" style="font-weight:400">· ${v.n.toLocaleString()} past cases · ${v.trade?'used as trades':'not used as trades'}</span></h3>
      <div class="tw"><table class="exptab"><thead><tr><th class="l">Idea</th><th>Signals</th><th>Right</th><th>Avg return</th><th>Edge vs index</th><th>Beat index</th><th>Bad trade (1 in 10)</th><th>Years better</th>${yrs.map(y=>`<th>${y}</th>`).join('')}<th class="l">Verdict</th></tr></thead><tbody>${v.table.map(t=>row(t,false)).join('')}${v.combined?row({...v.combined,label:'Adopted rules together',why:'What live '+k+' signals now use.'},true):''}</tbody></table></div>`;
    const A=x.adopted||{},F={rs_ok:'relative strength filter',regime_ok:'market regime filter'},X={hold:'hold to the end',stop:'stop at 3 × ATR',trail:'trailing stop 3 × ATR'};
    const use=Object.entries(A).map(([k,v])=>`<b>${k}</b>: ${v.trade?`${v.filters.length?v.filters.map(f=>F[f]).join(' + '):'no filter'}, ${X[v.exit]}`:'shown as a caution only (no tested edge)'}`).join(' · ');
    b.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Accuracy experiments</h2><span class="sub">run ${esc(x.run||'')} · ${x.n.toLocaleString()} past signals · unseen years ${yrs[0]}–${yrs[yrs.length-1]}</span></div>
    <p class="sub" style="margin:0">Each idea is tested only on years the patterns hadn't seen, with rules fixed in advance. <b>Edge vs index</b> is the return per trade minus what the index did over the same days, so ordinary market drift doesn't count. An idea is kept only if it raises that edge overall <i>and</i> in at least 70% of the years, while keeping at least a quarter of the signals.</p>

  const oa=+inp.other_allowances||0;

  if(oa>0)tryIt('Take ₹15,000 a year as gift vouchers','Non-cash gifts and vouchers from your employer are tax-free up to ₹15,000 a year (raised from ₹5,000 by the 2026 Rules), in both regimes.',{other_allowances:oa-Math.min(oa,15000)},true);
  const kids=Math.min(2,+inp.children||0),hst=Math.min(kids,+inp.hostel||0),cea=kids*36000+hst*108000;
  if(cea>0&&oa>0)tryIt("Children's education and hostel allowance",`Up to ₹3,000 a month a child for education and ₹9,000 a month a child for a hostel (2 children at most) are exempt in the old regime from tax year 2026-27, up from ₹100 and ₹300. That is ${RS(cea)} a year for you if part of your allowances is relabelled.`,{old_exempt:(+inp.old_exempt||0)+Math.min(oa,cea),other_allowances:oa-Math.min(oa,cea)},true);
  const room=150000-(+inp.sec123||0);if(room>0)tryIt('Use the rest of section 123 (old 80C)',`You have ${RS(room)} of room left. PPF, ELSS funds, voluntary PF, a 5-year tax-saving FD or Sukanya Samriddhi all qualify. Only helps if the old regime ends up cheaper.`,{sec123:150000},false);

  const hs=(inp.age!=='<60'||inp.self_senior_spouse)?50000:25000;if((+inp.health_self||0)<hs)tryIt('Health insurance for your family',`Premiums up to ${RS(hs)} are deductible in the old regime, and you get cover.`,{health_self:hs},false);
  const hp=inp.parents_senior?50000:25000;if((+inp.health_parents||0)<hp)tryIt("Health insurance for your parents",`A separate limit of ${RS(hp)} in the old regime.`,{health_parents:hp},false);

  moves.push(['PPF and EPF interest is tax-free in both regimes','Even in the new regime, interest on PPF (7.1% now) and EPF is not taxed, unlike FD interest. Voluntary PF (VPF) earns the EPF rate; interest stays tax-free while your own PF + VPF is within ₹2.5 lakh a year.']);

  moves.push(['Debt funds instead of FDs delay the tax','FD interest is taxed every year as it accrues. Gains on a debt fund are taxed at the same slab rate but only when you sell, so the tax is delayed and the money compounds meanwhile.']);

async function readPayslip(file,pw){let text='';
  if(/\.pdf$/i.test(file.name)||file.type==='application/pdf'){
    if(!window.pdfjsLib){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load the PDF reader. Check your connection.'));document.head.appendChild(s)});
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
    let doc;try{doc=await pdfjsLib.getDocument({data:await file.arrayBuffer(),password:pw||undefined}).promise}
    catch(e){if(e&&e.name==='PasswordException')throw new Error('This payslip is password protected. Type its password (often your PAN or date of birth) and choose the file again.');throw new Error('Could not read this PDF.')}
    for(let i=1;i<=Math.min(doc.numPages,3);i++){const tc=await (await doc.getPage(i)).getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n'}}
  else text=await file.text();
  if(!text.trim())throw new Error('No text found. A scanned (image) payslip cannot be read here; type the numbers instead.');
  return parsePayslip(text)}
function parsePayslip(t){const grab=re=>{const m=t.match(new RegExp('(?:'+re+')[^0-9\\n]{0,30}?(\\d[\\d,]*(?:\\.\\d{1,2})?)','i'));return m?+m[1].replace(/,/g,''):null};
  return {basic:grab('basic(?:\\s+(?:salary|pay|wage))?'),da:grab('dearness allowance|\\bD\\.?A\\.?\\b'),hra_received:grab('house rent allowance|\\bH\\.?R\\.?A\\.?\\b'),
    other_allowances:grab('special allowance|other allowance|flexi(?:ble)? (?:benefit|pay)'),employer_nps:grab("employer'?s? (?:contribution (?:to|towards) )?N\\.?P\\.?S|N\\.?P\\.?S\\.? \\(?employer"),
    professional_tax:grab('professional tax|prof\\.? tax|\\bP\\.?\\s?Tax\\b'),pf:grab('(?:employee\'?s? )?(?:provident fund|\\bE?\\.?P\\.?F\\.?\\b)'),tds:grab('income tax|\\bT\\.?D\\.?S\\b')}}

const MOREX=(()=>{
const emiOf=(P,ra,n)=>{const i=ra/1200;return i?P*i*(1+i)**n/((1+i)**n-1):P/n};
function monthlyIrr(net,pay,n){let lo=0,hi=1;const pv=r=>r?pay*(1-(1+r)**-n)/r:pay*n;for(let k=0;k<200;k++){const m=(lo+hi)/2;if(pv(m)>net)lo=m;else hi=m}return (lo+hi)/2}
function personalLoan(o){const P=+o.p,n=Math.round(+o.y*12),fee=P*(+o.fee||0)/100*(1+.18);
  const emi=o.kind==='flat'?(P+P*(+o.r)/100*(+o.y))/n:emiOf(P,+o.r,n);const mi=monthlyIrr(P-fee,emi,n);
  return {emi,fee,interest:emi*n-P,total:emi*n+fee,apr:((1+mi)**12-1)*100,nominal:mi*1200}}
function card(o){let b=+o.balance;const r=(+o.rate/100)*(o.gst==='yes'?1.18:1);let m=0,paid=0,int=0;
  while(b>0.5&&m<600){const it=b*r;int+=it;b+=it;const pay=o.mode==='fixed'?Math.min(b,+o.pay):Math.min(b,Math.max(b*(+o.minpct)/100,+o.minfloor||0));if(pay<=it&&pay<b)return {months:Infinity,interest:int,paid};b-=pay;paid+=pay;m++}
  return {months:m,interest:int,paid}}
const cagr=(a,b,y)=>a>0&&b>0&&y>0?(b/a)**(1/y)-1:null;
function cover(o){const real=((1+(+o.ret)/100)/(1+(+o.infl)/100))-1,yrs=+o.years,E=(+o.expense)*12;
  const pv=Math.abs(real)<1e-9?E*yrs:E*(1-(1+real)**-yrs)/real*(1+real);
  const need=pv+(+o.loans)+(+o.goals)-(+o.savings)-(+o.existing);return {pv,need:Math.max(0,need)}}
return {personalLoan,card,cagr,cover,monthlyIrr};
})();

function project(value,sip,r,years,step){const i=(1+r/100)**(1/12)-1;let b=+value||0,p=+sip||0,inv=+value||0;const yearly=[];
  for(let y=1;y<=years;y++){for(let k=0;k<12;k++){b=(b+p)*(1+i);inv+=p}yearly.push([y,inv,b]);p*=1+(+step||0)/100}
  return {value:b,invested:inv,yearly}}
const cagr=(s,key)=>{const x=s&&s[key];if(!x||!x.values||x.values.length<24)return null;const v=x.values,n=v.length;return {r:((v[n-1]/v[0])**(12/(n-1))-1)*100,from:x.months[0],to:x.months[n-1],name:x.name}};

})();

// ---------- money calculators (Plan & tax) ----------
// Pure arithmetic on assumptions the visitor sets, plus real history for "what if".
// Formulas live in CALCX so tests/test_money_calcs.py can check them; nothing leaves the browser.
// CALCX-BEGIN
const CALCX=(()=>{
const sipFV=(P,ra,n)=>{const i=ra/1200;return i?P*((1+i)**n-1)/i*(1+i):P*n};          // invested at the start of each month
const sipFor=(target,ra,n)=>{const f=sipFV(1,ra,n);return f?target/f:0};
const emi=(P,ra,n)=>{const i=ra/1200;return i?P*i*(1+i)**n/((1+i)**n-1):P/n};
function stepUp(P,step,ra,years){const i=ra/1200;let bal=0,inv=0,p=P;const rows=[];for(let y=1;y<=years;y++){for(let k=0;k<12;k++){bal=(bal+p)*(1+i);inv+=p}rows.push([y,inv,bal]);p*=1+step/100}return {value:bal,invested:inv,rows}}
function fd(P,ra,years,slab){const q=(1+ra/400)**4-1;let pre=P,post=P,tax=0;const rows=[];for(let y=1;y<=Math.ceil(years);y++){const f=Math.min(1,years-(y-1));const g=(1+q)**f-1;
  const ip=pre*g;pre+=ip;const ipo=post*g,t=ipo*slab/100;post+=ipo-t;tax+=t;rows.push([y,pre,post])}return {maturity:pre,afterTax:post,tax,rows}}
function rd(R,ra,months){let m=0;for(let j=1;j<=months;j++)m+=R*(1+ra/400)**(j/3);return {maturity:m,invested:R*months}}
function ppf(D,ra,years){let b=0;const rows=[];for(let y=1;y<=years;y++){b=(b+D)*(1+ra/100);rows.push([y,D*y,b])}return {maturity:b,invested:D*years,rows}}
function ssy(D,ra){let b=0;const rows=[];for(let y=1;y<=21;y++){if(y<=15)b+=D;b*=1+ra/100;rows.push([y,D*Math.min(y,15),b])}return {maturity:b,invested:D*15,rows}}
function epf(basic,growth,ra,years,start){let b=start,B=basic,inv=0;const rows=[];for(let y=1;y<=years;y++){let int=0;
  const eps=B<=15000?.0833*B:1250,c=.12*B+(.12*B-eps);for(let k=0;k<12;k++){b+=c;inv+=c;int+=b*ra/1200}b+=int;rows.push([y,inv+start,b]);B*=1+growth/100}return {corpus:b,contributed:inv,rows}}
function nps(P,step,ra,years,annuityPct,annuityRate){const s=stepUp(P,step,ra,years);const ann=s.value*annuityPct/100;
  return {corpus:s.value,invested:s.invested,lumpsum:s.value-ann,annuity:ann,pension:ann*annuityRate/1200,rows:s.rows}}
function retirement(o){const {age,retire,life,expense,inflation,pre,post,saved}=o,yr=retire-age,L=life-retire;
  const A=expense*12*(1+inflation/100)**yr,r=post/100,f=inflation/100;
  const corpus=Math.abs(r-f)<1e-9?A*L:A*(1-((1+f)/(1+r))**L)/(r-f)*(1+r);
  const grown=saved*(1+pre/100)**yr,need=Math.max(0,corpus-grown);
  return {yearlyAtRetirement:A,corpus,grown,need,sip:sipFor(need,pre,yr*12)}}
function swp(C,W,ra,stepPct){let b=C,w=W,m=0,paid=0;const i=ra/1200;while(b>0&&m<1200){if(m&&m%12===0)w*=1+stepPct/100;const t=Math.min(w,b);b-=t;paid+=t;b*=1+i;m++}return {months:b>0?Infinity:m,paid,left:b>0?b:0}}
function loan(P,ra,years,paidMonths,prepay,extra){const n=Math.round(years*12),E=emi(P,ra,n),i=ra/1200;
  let b=P,base=0;for(let k=0;k<n;k++){const it=b*i;base+=it;b-=E-it}
  b=P;let int=0,m=0;for(;m<paidMonths&&b>0.5;m++){const it=b*i;int+=it;b-=E-it}
  b-=Math.min(prepay,b);let after=0;for(;b>0.5&&m<n*2;m++){const it=b*i;int+=it;const pay=Math.min(b+it,E+extra);b-=pay-it}
  return {emi:E,totalInterest:base,newInterest:int,saved:base-int,months:m,monthsSaved:n-m}}
function irr(flows){let lo=-0.99,hi=10;const npv=r=>flows.reduce((a,[t,c])=>a+c/(1+r)**t,0);if(npv(lo)*npv(hi)>0)return null;for(let k=0;k<200;k++){const mid=(lo+hi)/2;if(npv(lo)*npv(mid)<=0)hi=mid;else lo=mid}return (lo+hi)/2}
return {sipFV,sipFor,emi,stepUp,fd,rd,ppf,ssy,epf,nps,retirement,swp,loan,irr};
})();

  if(sel&&!sel.options.length){sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===v.a?'selected':''}>${esc(S[k].name)}</option>`).join('');if(!S[v.a])v.a=sel.value}
  const s=S[v.a]||S[keys[0]];if(fromSel){const cur=fromSel.value||v.from;fromSel.innerHTML=s.months.slice(0,-1).map(mo=>`<option ${mo===cur?'selected':''}>${mo}</option>`).join('');if(!s.months.includes(cur))fromSel.value=s.months[0];v.from=fromSel.value}
  const i0=Math.max(0,s.months.indexOf(v.from)),M=s.months.slice(i0),P=s.values.slice(i0),last=P[P.length-1];
  const fdRate=y=>(A.rates.fd||{})[y]??6.5,cpi=y=>(A.cpi||{})[y]??5;
  let units=0,inv=0,fdv=0,cv=0;const flows=[],fdS=[],valS=[],invS=[];

    const put=v.mode==='sip'||k===0?v.p:0;if(put){units+=put/P[k];inv+=put;fdv+=put;cv+=put;flows.push([k/12,-put])}
    valS.push(units*P[k]);fdS.push(fdv);invS.push(inv)});
  const val=units*last;flows.push([(M.length-1)/12,val]);const r=CALCX.irr(flows);
  const step=Math.max(1,Math.round(M.length/60)),idx=M.map((_,k)=>k).filter(k=>k%step===0||k===M.length-1);
  return {tiles:[[RS(val),`worth now (${M[M.length-1]})`,val>=inv?'up':'down'],[RS(inv),'you put in'],[r!=null?num(r*100,1)+'%':'–','return a year'],[RS(fdS[fdS.length-1]),'same money in a bank FD'],[RS(cv),'what keeps pace with inflation']],

  if(!long||a[2]==='slab'){const r=a[0]===ASSETS.equity[0]?.20:slab;out.rate=r;out.taxable=gain;out.tax=gain*r*1.04;
    out.rule=a[2]==='slab'?'Debt funds bought from April 2023 are taxed at your slab rate however long you hold them.':(a[2]==='equity'?'Short-term (held 12 months or less): 20%.':`Short-term (held ${a[1]} months or less): taxed at your slab rate.`);return out}
  if(a[2]==='equity'){const free=Math.max(0,125000-(+o.used||0)),taxable=Math.max(0,gain-free);out.rate=.125;out.taxable=taxable;out.tax=taxable*.125*1.04;
    out.rule=`Long-term: 12.5% on gains above ₹1,25,000 a year (₹${Math.round(Math.min(free,gain)).toLocaleString('en-IN')} of this gain is tax-free).`;return out}
  out.rate=.125;out.taxable=gain;out.tax=gain*.125*1.04;out.rule='Long-term: 12.5% without indexation.';
  if(a[2]==='property'&&o.buy<'2024-07-23'&&o.resident!=='no'){const fb=Math.max(2001,fyStart(o.buy)),fs=fyStart(o.sell);
    if(CII[fb]&&CII[fs]){const ic=(+o.cost||0)*CII[fs]/CII[fb]+(+o.improve||0)*CII[fs]/CII[Math.max(2001,fyStart(o.improve_date||o.buy))];const ig=Math.max(0,sale-ic),it=ig*.20*1.04;
      out.indexed={cost:ic,gain:ig,tax:it,cii:[CII[fb],CII[fs]]};
      if(it<out.tax){out.tax=it;out.taxable=ig;out.rate=.20;out.rule=`Bought before 23 July 2024, so you may choose 20% with indexation (cost indexed ${CII[fb]} → ${CII[fs]}); it is lower here.`}
      else out.rule+=` (20% with indexation would be ₹${Math.round(it).toLocaleString('en-IN')}, so 12.5% is lower.)`}}

function advanceTax(o){const net=Math.max(0,(+o.tax||0)-(+o.tds||0));
  if(o.senior==='yes')return {net,due:[],note:'A resident aged 60 or more with no business or professional income does not pay advance tax; pay any balance as self-assessment tax before filing.'};
  if(net<10000)return {net,due:[],note:'Advance tax applies only when tax still due after TDS is ₹10,000 or more for the year.'};
  const sched=o.presumptive==='yes'?[['15 March 2027',1]]:[['15 June 2026',.15],['15 September 2026',.45],['15 December 2026',.75],['15 March 2027',1]];
  let paid=0;const due=sched.map(([d,c])=>{const amt=net*c-paid;paid=net*c;return [d,c,amt,net*c]});return {net,due,note:'Short or late payment costs simple interest of 1% a month on the shortfall. Seniors without business income and taxpayers whose net tax is under ₹10,000 are exempt.'}}

  else{amt=15/30*sal*yrs;how=`15/30 × average salary of the last 10 months × ${yrs} completed years`}
  const paid=+o.paid||amt;let exempt;if(o.govt==='yes')exempt=paid;else exempt=Math.max(0,Math.min(paid,amt,2000000-(+o.prior||0)));
  return {formula:amt,paid,exempt,taxable:Math.max(0,paid-exempt),how}}
