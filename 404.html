<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZOSH · markets & money, private by design</title>
<meta name="description" content="ZOSH: history-based market analysis, mutual funds, IPOs, bonds and your own money in one place. Your data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="copyright" content="© ZOSH. All rights reserved.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZOSH">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky search bar; home = scan overview; stock = header tiles, "right now" cards, then evidence sections */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#f1f3f6; --fg:#0f172a; --muted:#64748b; --line:#e6e8ec; --line2:#eef0f3;
  --accent:#2563eb; --accent-fg:#ffffff; --accent-soft:#eaf1fe; --up:#15803d; --down:#dc2626; --warn:#b45309; --strong:#15803d; --mod:#2563eb;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06); --shadow-lg:0 12px 32px rgba(16,24,40,.12);
  --radius:12px; --radius-sm:8px; --side:248px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --code:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0e13; --surface:#11161d; --sunk:#171d26; --fg:#e6e9ef; --muted:#8b95a5; --line:#232a35; --line2:#1b222c;
  --accent:#5b8cff; --accent-fg:#0b1020; --accent-soft:#16233f; --up:#22c55e; --down:#f2555a; --warn:#f0b03f; --strong:#22c55e; --mod:#5b8cff;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --shadow:none; --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0e13; --surface:#11161d; --sunk:#171d26; --fg:#e6e9ef; --muted:#8b95a5; --line:#232a35; --line2:#1b222c;
  --accent:#5b8cff; --accent-fg:#0b1020; --accent-soft:#16233f; --up:#22c55e; --down:#f2555a; --warn:#f0b03f; --strong:#22c55e; --mod:#5b8cff;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --shadow:none; --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--accent)}
.bar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em;font-size:1.05rem;cursor:pointer;display:flex;gap:8px;align-items:center}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.search{position:relative;flex:1;min-width:220px;max-width:520px}
.search input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.dd div{padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.dd .rr{margin-left:auto;flex-shrink:0}
.dd .rr span{padding:2px 6px}
.dd div:hover,.dd div.on{background:var(--sunk)}
.dd b{font-family:var(--mono);font-weight:500;min-width:110px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:.82rem;color:var(--muted);margin-left:auto}
main{max-width:1180px;margin:0 auto;padding:24px 20px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.9rem;letter-spacing:-.02em}
h2{font-size:1.15rem}
.sub{color:var(--muted);font-size:.9rem}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tile{background:var(--surface);padding:12px 14px}
.tile b{display:block;font-family:var(--mono);font-weight:500;font-size:1.2rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
th:first-child,td:first-child,td.l,th.l{text-align:left}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
.up{color:var(--up)} .down{color:var(--down)}
.chip{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.g-Strong{color:var(--strong)} .g-Moderate{color:var(--mod)} .g-Weak{color:var(--warn)} .g-No{color:var(--muted)} .g-Too{color:var(--muted)}
.i-high{color:var(--down)} .i-medium{color:var(--warn)} .i-low{color:var(--muted)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.card.bull{border-left:3px solid var(--up)} .card.bear{border-left:3px solid var(--down)} .card.neu{border-left:3px solid var(--muted)}
.card h3{font-size:1rem}
.card .meta{font-size:.84rem;color:var(--muted)}
.big{font-family:var(--mono);font-size:1.05rem}
.chart{position:relative;height:300px}
.chart.sm{height:140px}
.news{display:flex;flex-direction:column}
.news a.item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.news a.item:hover .t{text-decoration:underline}
.news .when{font-family:var(--mono);font-size:.75rem;color:var(--muted);min-width:86px}
.news .src{font-size:.78rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.claude{white-space:pre-wrap;line-height:1.6;max-width:75ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:200px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.err{color:var(--down);background:var(--sunk);border-radius:6px;padding:12px 14px}
.loading{color:var(--muted);display:flex;gap:10px;align-items:center}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.note{font-size:.8rem;color:var(--muted);max-width:90ch}

.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tab{padding:10px 14px;border:none;border-bottom:2px solid transparent;background:none;border-radius:0;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
.mk{font-family:var(--mono);font-size:.66rem;padding:1px 5px;border-radius:3px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:middle}
.idx{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:20px;align-items:center}
@media (max-width:760px){.idx{grid-template-columns:1fr}}
.idx .lvl{font-family:var(--mono);font-size:1.8rem;font-variant-numeric:tabular-nums}
.mcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}
.mcols>*{min-width:0}
.mitem{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.mitem:hover .mname{text-decoration:underline}
.mhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mname{font-weight:600}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.mrow .k{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:62px}
.lean-bullish{color:var(--up)} .lean-bearish{color:var(--down)} .lean-mixed{color:var(--muted)}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 28px;font-size:.78rem;color:var(--muted)}
.g-Look{color:var(--accent)}
.act{display:inline-block;font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.05em;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.act.BUY{color:var(--up)} .act.SELL{color:var(--down)}
.ls{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--sunk)}
.ls-Confirmed{color:var(--up)} .ls-Downgraded{color:var(--warn)} .ls-Suppressed{color:var(--down);text-decoration:line-through} .ls-Unchanged{color:var(--muted)}
.learn{font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.hit{color:var(--up);font-weight:600} .miss{color:var(--down);font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}
.bars div{display:grid;grid-template-columns:220px 1fr 40px;gap:10px;align-items:center;font-size:.86rem}
.bars i{display:block;height:10px;border-radius:2px;background:var(--accent)}
.conf{font-family:var(--mono);font-size:.7rem;padding:2px 6px;border-radius:3px;border:1px solid var(--accent);color:var(--accent)}
.conf.hi{background:var(--accent);color:var(--accent-fg)}
.cbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cbar select,.form input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input{width:140px}
.heat td{text-align:center;min-width:56px}
.size{font-size:.84rem;background:var(--sunk);border-radius:6px;padding:8px 10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.size b{font-family:var(--mono);font-weight:500;display:block}
.guide{max-width:860px;display:flex;flex-direction:column;gap:22px}
.guide h2{font-size:1.25rem}
.guide p,.guide li{max-width:72ch}
.guide ol,.guide ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.guide .step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.guide .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.glos{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 16px;font-size:.9rem}
.glos dt{font-weight:600} .glos dd{margin:0;color:var(--muted)}
#tour{position:fixed;inset:0;z-index:100;pointer-events:none}
#tour .hole{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,15,12,.55);border:2px solid var(--accent);transition:all .2s;pointer-events:none}
#tour .tip{position:fixed;max-width:340px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.3);pointer-events:auto;display:flex;flex-direction:column;gap:10px}
#tour .tip h3{font-size:1rem}
#tour .tip p{margin:0;font-size:.9rem;line-height:1.5}
#tour .tip .row{justify-content:space-between}
@media (prefers-reduced-motion:reduce){#tour .hole{transition:none}}
.barright{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.barright .status{margin-left:0}
.lwc{position:relative;height:440px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrls select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}
th.sortable{cursor:pointer;user-select:none}
.scf{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}.scf select,.scf button{width:100%;min-width:0}
@media (max-width:640px){.scf{grid-template-columns:1fr 1fr}.scf select{font-size:.8rem;padding-left:8px}}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.demo:empty{display:none!important}
#scT td:first-child,#fundsP td:first-child,#dvL td:first-child,#secT td:first-child,#pnT td:first-child,#stTab td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
#scT th:first-child,#fundsP th:first-child,#dvL th:first-child,#secT th:first-child,#pnT th:first-child,#stTab th:first-child{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--line)}
@media (max-width:640px){#scT td:first-child,#dvL td:first-child,#stTab td:first-child,#secT td:first-child{max-width:150px;white-space:normal}#pnT td:first-child,#fundsP td:first-child{max-width:190px}}
.pmn{padding:12px 0;border-top:1px solid var(--line)}.pmn:first-of-type{border-top:0}.pmi{margin:6px 0 0 2px;font-size:.88rem;line-height:1.45;white-space:normal;max-width:95ch}
.ib{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;min-height:0!important;padding:0;margin-left:5px;border-radius:50%;border:1px solid var(--muted);background:transparent;color:var(--muted);font:italic 700 10px/1 Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer;vertical-align:middle;position:relative;flex:0 0 auto}
.ib::after{content:"";position:absolute;inset:-9px}.ib:hover{color:var(--accent);border-color:var(--accent)}.ibx{cursor:default;margin:0 2px}
body.nohelp .ib,body.nohelp .phelp{display:none}
.phelp{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--sunk,var(--surface));border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:.86rem;line-height:1.5}
#gcard{position:fixed;z-index:1000;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:14px 16px;font-size:.86rem;line-height:1.5;max-height:80vh;overflow:auto;text-align:left;text-transform:none;letter-spacing:0;font-weight:400;white-space:normal}
#gcard.sheet{left:0;right:0;bottom:0;top:auto;width:auto!important;border-radius:16px 16px 0 0;padding-bottom:24px}
#gcard p{margin:8px 0 0}#gcard .gc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.95rem}
.gl{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:1px}
.gterm{padding:12px 0;border-top:1px solid var(--line)}.gterm:first-of-type{border-top:0}.gterm h3{margin:0 0 4px;font-size:1rem}.gterm p{margin:6px 0 0;max-width:80ch;font-size:.9rem;line-height:1.55}
.ftab td,.ftab th{white-space:normal;padding-left:8px;padding-right:8px}.ftab td:first-child{min-width:170px}.ftab td{min-width:74px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 10px;background:var(--surface)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;font-size:.86rem}
.evbox{font-size:.88rem;background:var(--sunk);border-radius:6px;padding:8px 12px;min-height:20px}
.heat2 td{text-align:center;font-family:var(--mono);font-size:.74rem;padding:5px 6px;min-width:46px}
.warn{background:color-mix(in srgb, var(--warn) 14%, transparent);border:1px solid var(--warn);border-radius:6px;padding:8px 12px;font-size:.88rem}
.helpbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);font-weight:600;border-radius:999px;padding:7px 14px 7px 8px;white-space:nowrap}
.helpbtn:hover{background:var(--accent);color:var(--accent-fg)}
.refbtn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-fg);border:1.5px solid var(--accent);font-weight:600;border-radius:999px;padding:7px 14px;white-space:nowrap}
.refbtn .ic{display:inline-block;font-size:1rem;line-height:1}
.refbtn.busy .ic{animation:s 1s linear infinite}
.refbtn:disabled{opacity:.85;cursor:progress}
body.static .refbtn{display:none}
.progbar{position:fixed;left:0;top:0;height:3px;background:var(--accent);z-index:30;transition:width .4s}
.helpbtn .q{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.helpbtn:hover .q{background:var(--accent-fg);color:var(--accent)}
@media (max-width:640px){.refbtn .lbl{display:none}.refbtn{padding:6px 9px}.bar-in{flex-wrap:nowrap}.search{min-width:0}.helpbtn{padding:6px}.helpbtn .lbl,.helpbtn{font-size:0}.helpbtn .q{font-size:.8rem}.barright .status{display:none}}
.plan{font-size:.84rem;line-height:1.5;color:var(--fg);background:var(--sunk);border-radius:6px;padding:8px 10px}
.verdict{display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--muted)}
.verdict.vb{border-left-color:var(--up)} .verdict.vs{border-left-color:var(--down)}
.verdict .vl{font-size:1.35rem;font-weight:700}
.demo{max-width:1200px;margin:0 auto;padding:8px 16px 0;font-size:.84rem;color:var(--muted)}
.demo b{color:var(--fg)}
body.static #mbtn,body.static #mmsg,body.static #ubtn,body.static [onclick^="runUni"],body.static [onclick^="lrun"],body.static [onclick*="confidence/train"],body.static [onclick*="experiments/run"],body.static [onclick*="ipo/run"],body.static section:has(#askq){display:none!important}

/* ---- filters / experiments ---- */
.fnote{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px}
.fnote .fx{color:var(--fg)} .fnote .ff{color:var(--down);font-weight:600}
.okc{color:var(--up)} .noc{color:var(--down)}
.exptab td.l{text-align:left;white-space:normal}
.exptab td.l:first-child{min-width:220px}

const TAX=(()=>{

function compute(inp,regime){const age=inp.age||'<60',senior=age==='60-80'||age==='80+',old=regime==='old',lines=[];

  const gross=salBase+hra+n(inp,'other_allowances')+n(inp,'bonus')+empNps;

function analyse(hold,P){

  const fx=P[FX],usd=fx&&fx.c.length?fx.c[fx.c.length-1]:null,rows=[],missing=[];
  for(const h of hold){const t=h.ticker,p=P[t];if(!p||!p.c.length){missing.push(t);continue}
    const last=p.c[p.c.length-1],m=mk(t),rate=(m==='US'||m==='CRYPTO')?usd:1;if(rate==null){missing.push(t);continue}
    const value=last*h.qty*rate,cost=(h.avg_price||last)*h.qty*rate;
    rows.push({ticker:t,display:disp(t),market:m,qty:h.qty,avg_price:h.avg_price??null,last,currency:(m==='US'||m==='CRYPTO')?'$':'₹',value,pnl:value-cost,
      pnl_pct:cost?value/cost-1:null,last_date:p.d[p.d.length-1]})}
  if(!rows.length)return {holdings:[],missing};
  const total=rows.reduce((a,r)=>a+r.value,0);for(const r of rows)r.weight=r.value/total;
  // daily returns in rupees on each series' own calendar, then aligned on the union of dates
  const fxAt=(()=>{if(!fx)return null;const D=fx.d.map(ts);return d=>{let lo=0,hi=D.length-1,k=-1;const x=ts(d);while(lo<=hi){const mid=(lo+hi)>>1;if(D[mid]<=x){k=mid;lo=mid+1}else hi=mid-1}return k<0?NaN:fx.c[k]}})();
  const rets=rows.map(r=>{const p=P[r.ticker];let c=p.c;if((r.market==='US'||r.market==='CRYPTO')&&fxAt)c=c.map((v,i)=>v*fxAt(p.d[i]));
    const m=new Map();for(let i=1;i<c.length;i++){const v=c[i]/c[i-1]-1;m.set(p.d[i],isFinite(v)?v:NaN)}return m});
  let dates=[...new Set(rows.flatMap(r=>P[r.ticker].d))].sort();
  dates=dates.filter(d=>rets.some(m=>Number.isFinite(m.get(d))));
  if(!dates.length)return {holdings:rows,missing,total,usd_inr:usd,days:0};
  const cut=ts(dates[dates.length-1])-3*365*DAY;dates=dates.filter(d=>ts(d)>=cut);
  const R=rets.map(m=>dates.map(d=>{const v=m.get(d);return Number.isFinite(v)?v:0}));
  const w=rows.map(r=>r.weight),port=dates.map((_,i)=>R.reduce((a,col,j)=>a+col[i]*w[j],0));

  if(dates.length>60){

    let cp=1,peak=1,mdd=0;for(const x of port){cp*=1+x;peak=Math.max(peak,cp);mdd=Math.min(mdd,cp/peak-1)}
    const tail=port.filter(x=>x<=q95);
    out.risk={vol_annual:Math.sqrt(varp(port))*Math.sqrt(252),var95_1d:-q95*total,var99_1d:-q99*total,cvar95_1d:-mean(tail)*total,
      var95_10d:-q95*Math.sqrt(10)*total,worst_day:worst,worst_day_date:dates[wi],max_drawdown:mdd};
    const n=R.length,C=n>1?R.map(a=>R.map(b=>cov1(a,b))):[[varp(R[0])]];
    const Cw=C.map(row=>row.reduce((a,v,j)=>a+v*w[j],0)),pv=w.reduce((a,v,i)=>a+v*Cw[i],0);
    rows.forEach((r,i)=>{r.risk_share=pv?w[i]*Cw[i]/pv:w[i]});
    out.correlation={tickers:rows.map(r=>r.display),matrix:R.map(a=>R.map(b=>{const v=pearson(a,b);return Number.isFinite(v)?r2(v):0}))};
    for(const [name,b] of [['beta_nifty','^NSEI'],['beta_sp500','^GSPC']]){const p=P[b];if(!p)continue;
      const m=new Map();for(let i=1;i<p.c.length;i++)m.set(p.d[i],p.c[i]/p.c[i-1]-1);
      const br=dates.map(d=>{const v=m.get(d);return Number.isFinite(v)?v:0});if(varp(br)>0)out.risk[name]=cov1(port,br)/varp(br)}}
  const hhi=rows.reduce((a,r)=>a+r.weight**2,0),top=rows.reduce((a,r)=>r.weight>a.weight?r:a,rows[0]);
  const ws=m=>rows.filter(r=>r.market===m).reduce((a,r)=>a+r.weight,0);
  out.concentration={top:top.display,top_weight:top.weight,effective_n:hhi?1/hhi:null,india:ws('IN'),us:ws('US'),crypto:ws('CRYPTO')};
  out.stress=stress(rows,P,fx,total);

function stress(rows,P,fx,total){const out=[];
  for(const sc of SCEN){let loss=0;const parts=[],est=[];
    for(const r of rows){const [a,b]=(P[r.ticker].sc||{})[sc.id]||[];let ret,how;
      if(a&&b){ret=b/a-1;how='actual'}
      else{const bp=P[bench(r.ticker)],[ba,bb]=bp?(bp.sc||{})[sc.id]||[]:[];if(!(ba&&bb)){parts.push({display:r.display,ret:null,how:'no data'});continue}
        ret=P[r.ticker].beta*(bb/ba-1);how='estimated';est.push(r.display)}
      if((r.market==='US'||r.market==='CRYPTO')&&fx){const [fa,fb]=(fx.sc||{})[sc.id]||[];if(fa&&fb)ret=(1+ret)*(fb/fa)-1}
      loss+=r.value*ret;parts.push({display:r.display,ret,how})}
    const np=P['^NSEI'],[na,nb]=np?(np.sc||{})[sc.id]||[]:[],nRet=na&&nb?nb/na-1:null;
    if(!parts.some(p=>p.ret!=null)){out.push({...sc,pnl:null,pnl_pct:null,nifty:nRet,parts:[],estimated:[],note:'no price data for this period'});continue}
    const sorted=parts.map((p,i)=>[p,i]).sort((x,y)=>((x[0].ret==null)-(y[0].ret==null))||((x[0].ret||0)-(y[0].ret||0))||(x[1]-y[1])).map(x=>x[0]);
    out.push({...sc,pnl:loss,pnl_pct:total?loss/total:null,nifty:nRet,parts:sorted.slice(0,6),estimated:est})}
  for(const sh of SHOCKS){const loss=rows.reduce((a,r)=>a+r.value*P[r.ticker].beta*sh,0);
    out.push({id:`shock${Math.trunc(sh*100)}`,name:`Markets fall ${Math.abs(Math.trunc(sh*100))}% (beta-based)`,start:null,end:null,pnl:loss,
      pnl_pct:total?loss/total:null,nifty:sh,parts:[],estimated:[]})}
  return out}

  await refreshStatus();watchJob(()=>{route();$('#status').textContent=ST.job.message==='finished'?'Everything is up to date.':ST.job.message})}
function watchJob(after){clearInterval(poll);poll=setInterval(async()=>{await refreshStatus();if(!ST.job.running){clearInterval(poll);$('#status').textContent=ST.job.message==='finished'?'Done.':ST.job.message;after&&after()}},3000)}

// ---------- search ----------
let sel=-1,results=[],t0;
$('#q').addEventListener('input',e=>{clearTimeout(t0);const v=e.target.value;if(!v.trim()){$('#dd').hidden=true;return}
  t0=setTimeout(async()=>{results=await api('/api/search?q='+encodeURIComponent(v)).catch(()=>[]);sel=-1;drawDD()},200)});
$('#q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){sel=Math.min(sel+1,results.length-1);drawDD();e.preventDefault()}
  else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);drawDD();e.preventDefault()}
  else if(e.key==='Enter'){const r=results[sel>=0?sel:0];pick(r?r.symbol:e.target.value.trim().toUpperCase())}
  else if(e.key==='Escape'){$('#dd').hidden=true}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#dd').hidden=true});
function drawDD(){const d=$('#dd');if(!results.length){d.innerHTML='<div class="sub">No match. Press Enter to try it as a ticker (TCS.NS, AAPL).</div>';d.hidden=false;return}
  d.innerHTML=results.map((r,i)=>`<div class="${i===sel?'on':''}" data-s="${esc(r.symbol)}"><b>${esc(r.display)}${mk(r.market)}</b><span>${r.name&&r.name!==r.display?esc(r.name):''}</span>${rrChip(r.rr)}</div>`).join('');
  d.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>pick(x.dataset.s));d.hidden=false}
function pick(sym){if(!sym)return;$('#dd').hidden=true;$('#q').value='';go('s/'+encodeURIComponent(sym))}

const FNAME={rs_ok:'weak relative strength',regime_ok:'market regime against it',no_edge:'SELL signals showed no edge on unseen years, so treat this as a caution, not a short'};
function fbox(f){if(!f)return '';const L=[];
  const fl=(f.failed||[]).filter(x=>x!=='no_edge');if((f.failed||[]).includes('no_edge'))L.push(`<span class="ff">Caution only: SELL signals showed no edge on unseen years, so this isn't a short or a sell call.</span>`);
  if(fl.length)L.push(`<span class="ff">Skipped by tested filter: ${fl.map(x=>FNAME[x]||x).join(' and ')}.</span>`);
  (f.notes||[]).forEach((n,i)=>{const key=i===0?'rs_ok':'regime_ok',ok=(f.active||[]).includes(key)?f[key]:null;L.push(`<span>${ok===true?'<b class="okc">✓</b>':ok===false?'<b class="noc">✗</b>':'·'} ${esc(n)}</span>`)});
  if(f.exit_text)L.push(`<span class="fx"><b>Exit plan:</b> ${esc(f.exit_text)}</span>`);
  return L.length?`<div class="fnote">${L.join('')}</div>`:''}

const lakh=v=>v==null?'–':v>=1e7?'₹'+num(v/1e7,2)+' Cr':v>=1e5?'₹'+num(v/1e5,2)+' lakh':'₹'+num(v,0);
const fdate=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'–';
function ipoCard(r,today){
  const call=r.call||'Too early',cc=call.split(' ')[0];

  const S=r.similar||{};

  const news=(r.news||[]).slice(0,4);
  return `<div class="mc ipo ${cc}"><div class="mc-h"><span class="mc-t">${esc(r.name)}</span><span class="segchip ${r.segment}">${esc(r.segment==='SME'?r.exchange||'SME':'Mainboard')}</span><span class="mc-n">${esc(r.industry||'')}</span>${STATIC?'':`<span class="vpill ${call==='Neutral'||call==='Too early'?'watch':''}">${esc(STATIC?({Apply:'History favourable',Avoid:'History weak',Neutral:'History mixed'}[call]||'Too early'):(call==='Apply'?'Apply (history favours)':call==='Avoid'?'Avoid':call==='Neutral'?'Neutral':'Too early'))}</span>`}</div>
    <div class="tl">${tl}</div>
    <div class="pstats">
      <div class="ps"><span>Price</span><b>${r.price!=null?'₹'+num(r.price,0):'–'}</b><i>${(()=>{const n=(r.price_band||r.price_range||'').match(/\d+(\.\d+)?/g)||[];return n.length>1&&n[0]!==n[1]?'band ₹'+n[0]+'–'+n[1]:''})()}</i></div>
      <div class="ps"><span>1 lot</span><b>${r.lot!=null?num(r.lot,0):'–'}</b><i>${r.min_invest?lakh(r.min_invest):''}</i></div>
      <div class="ps"><span>Issue size</span><b>${r.size_cr!=null?'₹'+num(r.size_cr,0)+' Cr':'–'}</b></div>
      <div class="ps"><span>GMP</span><b class="${cls(r.gmp_pct)}">${r.gmp!=null?'₹'+num(r.gmp,1):'–'}</b><i>${r.gmp_pct!=null?pct(r.gmp_pct,1):''}${r.gmp_low!=null&&r.gmp_high!=null&&(r.gmp_low||r.gmp_high)?` · range ${num(r.gmp_low,0)}–${num(r.gmp_high,0)}`:''}</i></div>
      <div class="ps"><span>Est. listing</span><b>${r.est_listing?'₹'+num(r.est_listing,1):'–'}</b><i>price + GMP</i></div>
    </div>
    ${subs}
    <div class="sig"><div class="sig-h"><b>${STATIC?'What similar past IPOs did':'Why this call'}</b>${!STATIC&&r.p_up!=null?`<span class="sub" style="margin-left:auto">${cmeter(r.p_up,0.75)}</span>`:''}</div><ul class="why">${(r.reasons||[]).filter(x=>!STATIC||!/^model/i.test(x)).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${S.n?`<div class="sig-f"><span>Similar past IPOs: <b style="color:var(--fg)">${S.n}</b></span><span>·</span><span>closed listing day up <b style="color:var(--fg)">${pct(S.up,0,false)}</b></span><span>·</span><span>median <b class="${cls(S.median)}">${pct(S.median,0)}</b></span>${S.big_loss!=null?`<span>·</span><span>fell over 10%: ${pct(S.big_loss,0,false)}</span>`:''}</div>`:''}</div>
    ${ex}
    ${news.length?`<div class="news">${news.map(n=>`<a class="item" href="${esc(n.link)}" target="_blank" rel="noopener"><span class="when">${ago(n.published)}</span><span>${n.impact!=='low'?`<span class="chip i-${esc(n.impact)}">${esc(n.impact)}</span> `:''}<div class="t">${n.direction==='positive'?'<span class="up">▲</span> ':n.direction==='negative'?'<span class="down">▼</span> ':''}${esc(n.title)}</div><div class="src">${esc(n.source)}</div></span></a>`).join('')}</div>`:'<div class="sub" style="font-size:.8rem">No news in the last 10 days.</div>'}
    <div class="note" style="margin:0">${r.lead_managers?'Lead managers: '+esc(r.lead_managers)+'. ':''}${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">GMP source</a>`:''}</div></div>`}

// ---------- Matches cards ----------
const KIND={trigger:'Today',forming:'Forming',analog:'Look-alike'};
function wbar(label,me,base,color){return `<div class="wbar" style="--lc2:${color}"><span class="lbl">${label}</span><div class="trk"><div class="fill me" style="width:${Math.round((me||0)*100)}%"></div></div><span class="val">${pct(me,0,false)}</span><span class="lbl">Normal day</span><div class="trk"><div class="fill base" style="width:${Math.round((base||0)*100)}%"></div></div><span class="val" style="color:var(--muted);font-weight:400">${pct(base,0,false)}</span></div>`}
function cmeter(c,th){if(c==null||STATIC)return '';const hi=th!=null&&c>=th;return `<span class="cmeter ${hi?'hi':''}" title="Confidence model score${th!=null?' (target threshold '+Math.round(th*100)+'%)':''}">conf <span class="trk"><span class="fill" style="display:block;width:${Math.round(c*100)}%"></span></span>${Math.round(c*100)}%</span>`}
function sigBlock(i,th){const kind=i.kind==='trigger'?'trigger':i.kind==='forming'?'forming':'analog';const p=i.plan;
  const col=i.bias==='bearish'?'var(--down)':'var(--up)';
  const upTxt=i.bias==='bearish'?`Fell after ${i.horizon}d`:`Rose after ${i.horizon}d`;
  const me=i.bias==='bearish'&&i.win!=null?1-i.win:i.win,base=i.bias==='bearish'&&i.base_win!=null?1-i.base_win:i.base_win;
  const stats=p?`<div class="pstats">
      <div class="ps"><span>${STATIC?(kind==='trigger'?'Past direction':'If it fires, past'):(kind==='trigger'?'Action':'If it fires')}</span><b class="${p.action==='BUY'?'up':'down'}">${dirTxt(p.action)}</b></div>
      <div class="ps"><span>Hold</span><b>${p.hold_days}d</b><i>~${Math.round(p.hold_days/DPM*10)/10} months</i></div>
      <div class="ps"><span>Median</span><b class="${cls(p.median)}">${pct(p.median)}</b><i>normal ${pct(p.normal_median)}</i></div>
      <div class="ps"><span>Worked</span><b>${pct(p.win,0,false)}</b><i>of ${p.n} cases</i></div>
      <div class="ps"><span>Usual dip</span><b class="down">${pct(p.typical_dip)}</b><i>1 in 5: ${pct(p.bad_dip)}</i></div>
    </div>`:'';
  const lt=i.learning;const learn=lt?`${lchip(lt)}${lt.status!=='Unchanged'?` <span>→ ${pct(lt.adjusted,0,false)} after learning</span>`:''}`:'';
  const foot=[cmeter(i.confidence,th),learn,p&&p.exit_by&&kind==='trigger'?`<span>exit around <b style="color:var(--fg)">${esc(p.exit_by)}</b></span>`:''].filter(Boolean).join('<span>·</span>');
  return `<div class="sig ${kind}"><div class="sig-h"><span class="kind ${kind}">${KIND[kind]}</span>${arrow(i.bias)} <b>${esc(i.pattern_name)}</b> ${gchip(i.grade)}<span class="sub" style="margin-left:auto;font-size:.76rem">${i.n} past cases</span></div>
    ${i.forming_text?`<div class="sub" style="font-size:.8rem">${esc(i.forming_text)}</div>`:''}
    ${wbar(upTxt,me,base,col)}${stats}${foot?`<div class="sig-f">${foot}</div>`:''}${fbox(i.filters)}</div>`}
function matchCard(e,th){DPM=mktOf(e.symbol)==='CRYPTO'?30:21;const v=e.verdict||e.lean;const watch=/watch/i.test(v);
  return `<div class="mc ${esc(e.lean)}" onclick="${link(e.symbol)}"><div class="mc-h"><span class="mc-t">${esc(e.display)}</span><span class="mc-n">${e.name&&e.name!==e.display?esc(e.name):''}</span>${rrChip(e.rr)}<span class="vpill ${watch?'watch':''}">${esc(vtxt(v))}</span><span class="mc-p">${e.currency}${num(e.close)}</span></div>
    ${e.items.map(i=>sigBlock(i,th)).join('')}</div>`}

  const th=cf.threshold&&cf.threshold.reachable?cf.threshold.threshold:null;
  const passes=e=>e.items.some(i=>i.kind==='trigger'&&i.confidence!=null&&th!=null&&i.confidence>=th&&(i.learning||{}).status!=='Suppressed'&&(i.filters||{}).passes!==false);
  if(SET.high_conf_only){for(const k of ['India','US','Crypto','Funds'])if(d[k])d[k].items=d[k].items.filter(passes)}
  const nToday=['India','US','Crypto','Funds'].reduce((s,k)=>s+((d[k]&&d[k].items.filter(passes).length)||0),0);

  const col=(label,g)=>`<section class="panel"><div class="row" style="justify-content:space-between"><h2>${label==='India'?'India · NIFTY 50 + watchlist':label==='US'?'US · S&P 500 + watchlist':label==='Funds'?'Mutual funds · top direct-growth funds':'Crypto · top coins + watchlist'} <span class="mcount">${g?.items?.length||0} setups</span></h2><span class="sub">${g?.generated?'scanned '+esc(g.generated):'not scanned yet'}</span></div>
    ${g&&g.items.length?`<div class="mlist">${g.items.map(e=>matchCard(e,th)).join('')}</div>`:'<div class="empty">No stock has a pattern that passed the honest test today. That is the usual case: once each pattern is checked against random days and trading costs, most show no real edge. <a href="#/record">See the track record</a> or <a href="#/research">how patterns are tested</a>.</div>'}</section>`;

      <li><b>Grade.</b> Strong: significant (p ≤ 0.05), at least 15 past cases, and the same direction in the earlier and later halves of history. Moderate: weaker but consistent. Weak or No edge: shown for reference, never alerted.</li>

  <section class="panel"><h2>Glossary</h2>

      <dt>RSI</dt><dd>0–100 gauge of recent up vs down moves; below 30 = oversold, above 70 = overbought.</dd>

let tourI=0;
function startTour(){tourI=0;let o=$('#tour');if(!o){o=document.createElement('div');o.id='tour';o.innerHTML='<div class="hole"></div><div class="tip" role="dialog" aria-live="polite"></div>';document.body.appendChild(o)}o.hidden=false;showStep()}
function endTour(){const o=$('#tour');if(o)o.hidden=true;try{localStorage.setItem('pd_tour_done','1')}catch(e){}}
async function showStep(){const s=TOUR[tourI];if(!s)return endTour();
  if(STATIC&&(PRED_ONLY.includes(s.go)||['#mbtn','#tgt','.mcols','#refAll'].includes(s.sel))){tourI++;return showStep()}
  if(s.go&&!location.hash.endsWith(s.go)){go(s.go);await new Promise(r=>setTimeout(r,900))}
  let el=document.querySelector(s.sel);const hole=$('#tour .hole'),tip=$('#tour .tip');
  if(el){el.scrollIntoView({block:'center',behavior:'instant'});const r=el.getBoundingClientRect();
    Object.assign(hole.style,{display:'block',left:r.left-6+'px',top:r.top-6+'px',width:r.width+12+'px',height:Math.min(r.height+12,innerHeight-20)+'px'});
    const below=r.bottom+200<innerHeight;tip.style.top=(below?r.bottom+14:Math.max(12,r.top-14-180))+'px';tip.style.left=Math.max(12,Math.min(r.left,innerWidth-360))+'px'}
  else{hole.style.display='none';tip.style.top='30%';tip.style.left='calc(50% - 170px)'}
  tip.innerHTML=`<div class="eyebrow">Step ${tourI+1} of ${TOUR.length}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p><div class="row"><button onclick="endTour()">Skip</button><span class="row" style="gap:6px">${tourI?'<button onclick="tourI--;showStep()">Back</button>':''}<button class="primary" onclick="tourI++;showStep()">${tourI===TOUR.length-1?'Done':'Next'}</button></span></div>`;
  tip.querySelector('.primary').focus()}
document.addEventListener('keydown',e=>{const o=$('#tour');if(!o||o.hidden)return;if(e.key==='Escape')endTour();if(e.key==='ArrowRight'){tourI++;showStep()}if(e.key==='ArrowLeft'&&tourI){tourI--;showStep()}});

const INR=v=>{if(v==null)return '–';const r=Math.round(v);return (r<0?'-':'')+'₹'+Math.abs(r).toLocaleString('en-IN')};
const LAKH=v=>{if(v==null)return '–';const a=Math.abs(v),s=v<0?'-':'';return a>=1e7?s+'₹'+(a/1e7).toFixed(2)+' Cr':a>=1e5?s+'₹'+(a/1e5).toFixed(2)+' L':INR(v)};

// ---------- Ways to save: exact arithmetic on the visitor's own holdings ----------
// Each item is a sum in rupees worked out from what the person holds and from published
// rules or measured history. Nothing here predicts a price.
function saveItems(mf,tax,nw,funds){
  const out=[],F=(mf&&mf.funds)||[],byReg={};
  ((funds&&funds.funds)||[]).forEach(f=>{if(f.regular_code&&f.regular)byReg[String(f.regular_code)]=f});
  // 1. Regular plans: the same fund is sold without the distributor's yearly commission
  const reg=F.filter(f=>f.plan==='Regular'&&f.value>0).map(f=>{const k=byReg[String(f.ticker).split('.')[0]],gap=k?k.regular.gap:0.009;
    return {name:f.name,value:f.value,gap,measured:!!k,yearly:f.value*gap,direct:k?k.name:null}});
  if(reg.length){const y=reg.reduce((s,x)=>s+x.yearly,0),v=reg.reduce((s,x)=>s+x.value,0);
    out.push({key:'regular',kind:'yearly',amount:y,title:`Move ${reg.length} Regular-plan fund${reg.length>1?'s':''} to Direct`,
      why:`You hold ${LAKH(v)} in Regular plans. A Regular plan is the same fund with a distributor's commission taken out every year. On your holdings that is about ${INR(Math.round(y))} a year, and it grows as the funds grow.`,
      how:'Switch each to the Direct plan of the same fund, with the fund house or any direct platform. A switch counts as a sale, so check the exit load (usually nil after one year) and the capital gains tax first; where the tax is large, stop new SIPs in the Regular plan and start them in Direct instead.',
      rows:reg.sort((a,b)=>b.yearly-a.yearly).map(x=>[sn(x.name),LAKH(x.value),pct(x.gap,2,false)+' a year'+(x.measured?'':' (typical)'),INR(Math.round(x.yearly))+' a year']),head:['Fund','You hold','Extra cost','On your holding'],
      basis:reg.every(x=>x.measured)?'Measured from the two plans\' own NAVs.':'Measured from the two plans\' NAVs where the fund is in our list; otherwise the typical 0.9% a year across 115 funds.'})}
  // 2. the yearly tax-free allowance on long-term gains
  if(tax&&tax.harvest_total>0){const s=tax.harvest_total*0.125*1.04;
    out.push({key:'harvest',kind:'once',amount:s,deadline:tax.fy_end,title:`Book ${INR(Math.round(tax.harvest_total))} of gains tax-free before ${tax.fy_end.split('-').reverse().join('/')}`,
      why:`The first ₹1.25 lakh of long-term gains on shares and equity funds each year is tax-free, and the allowance cannot be carried forward. You have ${INR(Math.round(tax.ltcg_room))} of it left with ${tax.days_left} days to go.`,
      how:'Sell the units below and buy them back. Your purchase price resets higher, so that much gain is never taxed. Mind the exit load on funds bought within a year, and the small cost of selling and buying.',
      rows:tax.harvest.map(h=>[sn(h.name),INR(Math.round(h.value)),INR(Math.round(h.gain)),INR(Math.round(h.tax_saved_later))]),head:['Sell and buy back','Value','Gain booked','Tax saved later'],
      basis:'12.5% long-term capital gains tax plus 4% cess, on gains above ₹1.25 lakh a year.'})}
  // 3. losses that offset gains already booked this year
  if(tax&&tax.losses&&tax.losses.length&&(tax.gains_to_offset.short>0||tax.gains_to_offset.long_taxable>0)){
    let sg=tax.gains_to_offset.short,lg=tax.gains_to_offset.long_taxable,s=0;const used=[];
    tax.losses.forEach(l=>{let x=-l.loss;if(l.term==='short'){const a=Math.min(x,sg);sg-=a;x-=a;s+=a*0.2;const b=Math.min(x,lg);lg-=b;s+=b*0.125;if(a+b>0)used.push([sn(l.name),INR(Math.round(l.loss)),'short-term',INR(Math.round((a*0.2+b*0.125)*1.04))])}
      else{const b=Math.min(x,lg);lg-=b;s+=b*0.125;if(b>0)used.push([sn(l.name),INR(Math.round(l.loss)),'long-term',INR(Math.round(b*0.125*1.04))])}});
    if(s>0)out.push({key:'losses',kind:'once',amount:s*1.04,deadline:tax.fy_end,title:'Use paper losses against gains you have booked',
      why:`You have booked taxable gains this year. Selling holdings that are below what you paid turns their paper loss into a real one, which is set against those gains.`,
      how:'Sell before 31 March. You may buy back later if you still want the holding. A short-term loss offsets any gain; a long-term loss offsets only long-term gains.',
      rows:used,head:['Holding','Paper loss','Type','Tax saved'],basis:'20% on short-term and 12.5% on long-term equity gains, plus 4% cess.'})}
  // 4. borrowing at a high rate while lending at a low one
  const L=((nw&&nw.items&&nw.items.liabilities)||[]).map(x=>({...x,value:+(x.outstanding??x.value)||0})).filter(x=>x.value>0&&+x.rate>0).sort((a,b)=>b.rate-a.rate);
  const D=((nw&&nw.items&&nw.items.assets)||[]).filter(a=>['fd','rd','cash'].includes(a.type)&&+a.value>0);
  if(L.length&&D.length){const slab=(tax&&tax.slab!=null)?tax.slab:0.3;let pool=D.reduce((s,a)=>s+ +a.value,0);const earn=D.reduce((s,a)=>s+ +a.value*(+a.rate||3),0)/pool*(1-slab);let y=0;const rows=[];
    L.forEach(l=>{const use=Math.min(pool,+l.value);if(use<=0||+l.rate<=earn)return;pool-=use;const g=use*(+l.rate-earn)/100;y+=g;rows.push([l.name||(LIAB_TYPES[l.type]||'Loan'),pct(+l.rate/100,1,false),LAKH(use),INR(Math.round(g))+' a year'])});
    if(y>0)out.push({key:'debt',kind:'yearly',amount:y,title:'Pay down costly loans with low-earning deposits',
      why:`Your deposits and savings earn about ${earn.toFixed(1)}% a year after tax, while you pay more than that on borrowing. Every rupee moved from one to the other earns the difference with no risk.`,
      how:'Keep an emergency fund of about six months of expenses first. Then pay the highest-rate loan before the others, starting with any credit card balance. Check for a prepayment charge on fixed-rate loans.',
      rows,head:['Loan','Its rate','Could repay','Saving'],basis:`Deposit interest taxed at your ${Math.round(slab*100)}% slab; loan interest at the rates you entered.`})}
  // 5. funds that have trailed a plain index fund (what it has cost, not a promise)
  const lag=F.filter(f=>f.value>0&&f.y5!=null&&f.r5!=null&&f.r5<f.y5-0.01&&(!f.rolling||f.rolling.beat_share<0.5)).map(f=>({name:f.name,value:f.value,gap:f.y5-f.r5,beat:f.rolling?f.rolling.beat_share:null,yard:f.yardstick}));
  if(lag.length){const y=lag.reduce((s,x)=>s+x.value*x.gap,0);
    out.push({key:'lag',kind:'history',amount:y,title:`Review ${lag.length} fund${lag.length>1?'s':''} that trailed a plain index fund for five years`,
      why:`Over the last five years these funds returned less each year than a low-cost index fund for the same part of the market, and beat it in fewer than half of all three-year periods. On what you hold, that gap has been worth about ${INR(Math.round(y))} a year.`,
      how:'This is what the past cost, not a forecast: a fund that lagged can recover. But five years behind, most of the time, is a reason to ask what you are paying for. Compare each with its index fund on the Mutual funds page before deciding.',
      rows:lag.sort((a,b)=>b.value*b.gap-a.value*a.gap).map(x=>[sn(x.name),LAKH(x.value),pct(-x.gap,1)+' a year',x.beat==null?'–':pct(x.beat,0,false)+' of periods']),head:['Fund','You hold','Against its index fund','Beat it in'],
      basis:'Each fund\'s own NAV against a Direct index fund, both after costs.'})}
  // 6. two funds doing one job
  if(mf&&(mf.same_job||[]).length)out.push({key:'same',kind:'tidy',amount:0,title:`${mf.same_job.length} pair${mf.same_job.length>1?'s':''} of your funds do the same job`,
    why:'These funds have moved almost identically over the last year, so holding both adds paperwork and cost without spreading your risk.',
    how:'Keep the one with the lower cost and the better record against its index fund, and direct new money there. There is no need to sell the other at once if that would trigger tax.',
    rows:mf.same_job.map(p=>[sn(p.a),sn(p.b),pct(p.corr,0,false)]),head:['Fund','and','Moved together'],basis:'Daily NAV changes over the last year.'});
  return out}

// ---------- Money health check: planners' rules of thumb applied to the visitor's own numbers ----------
// Arithmetic on what the person entered. It ranks what to fix first; it does not pick investments.
const MHP=()=>LS.get('zosh_me_profile',{});
function moneyChecks(d,P){
  const C=d.classes||{},v=k=>+C[k]||0,out=[],fin=(d.assets||0)-v('Real estate');
  const inc=+P.income||0,exp=+P.expenses||0,emi=+P.emi||0,age=+P.age||0,L=(d.items&&d.items.liabilities)||[];
  const ask=(k,title,what)=>out.push({k,title,level:'ask',value:'–',text:`Enter ${what} below to check this.`});
  const costly=L.filter(x=>['credit_card','personal_loan'].includes(x.type)).reduce((a,x)=>a+(+x.outstanding||0),0);
  out.push({k:'debt',title:'Costly debt',level:costly>0?'bad':'good',value:costly>0?LAKH(costly):'None',
    text:costly>0?'Credit card dues and personal loans usually cost 12% to 40% a year, more than any investment reliably earns.':'No credit card dues or personal loans recorded.',
    todo:costly>0?`Clear ${LAKH(costly)} of card and personal-loan debt before investing more. Nothing else gives a return this certain.`:null});
  if(exp){const cash=v('Cash')||+P.cash||0,mths=cash/exp;
    out.push({k:'cash',title:'Emergency money',level:mths>=6?'good':mths>=3?'warn':'bad',value:mths.toFixed(1)+' months',
      text:`${LAKH(cash)} in savings and cash covers ${mths.toFixed(1)} months of your ${INR(exp)} monthly spending. Six months is the usual aim, so a job loss or hospital bill does not force you to sell investments or borrow.`,
      todo:mths<6?`Add ${LAKH(6*exp-cash)} to savings, a sweep FD or a liquid fund to reach six months of spending.`:null})}
  else ask('cash','Emergency money','your monthly expenses');
  if(P.dependants){if(inc){const need=inc*120,have=+P.term||0;
      out.push({k:'life',title:'Life cover',level:have>=need?'good':have>=need/2?'warn':'bad',value:LAKH(have),
        text:`Someone depends on your income. A common yardstick is cover of 10 times yearly income: ${LAKH(need)} for you.`,
        todo:have<need?`Take about ${LAKH(need-have)} more term cover. Plain term insurance is the cheapest way to get it.`:null})}
    else ask('life','Life cover','your monthly income')}
  if(P.health!=null&&P.health!==''){const h=+P.health||0;
    out.push({k:'health',title:'Health cover',level:h>=1000000?'good':h>=500000?'warn':'bad',value:h?LAKH(h):'None',
      text:'One hospital stay in a private hospital can cost several lakh. Cover from an employer ends with the job.',
      todo:h<500000?'Take your own family health cover of at least ₹5 lakh, ideally ₹10 lakh or more.':h<1000000?'Consider a top-up to take health cover to ₹10 lakh or more; top-ups are cheap.':null})}
  else ask('health','Health cover','your health cover (0 if none)');
  if(inc&&(emi||d.liabilities>0)){const sh=emi/inc;
    out.push({k:'emi',title:'Loan payments',level:sh<=.3?'good':sh<=.4?'warn':'bad',value:pct(sh,0,false)+' of income',
      text:`EMIs of ${INR(emi)} take ${pct(sh,0,false)} of your ${INR(inc)} monthly income. Lenders and planners treat about 30% to 40% as the ceiling.`,
      todo:sh>.4?'Bring EMIs under 40% of income: prepay the costliest loan first, and avoid new loans until then.':null})}
  else if(d.liabilities>0)ask('emi','Loan payments','your monthly income and total EMIs');
  if(inc&&exp){const r=(inc-exp-emi)/inc;
    out.push({k:'save',title:'How much you save',level:r>=.2?'good':r>=.1?'warn':'bad',value:pct(r,0,false)+' of income',
      text:`After spending and EMIs you keep ${INR(Math.max(0,inc-exp-emi))} a month. Saving 20% or more of income is the usual target.`,
      todo:r<.2?`Find ${INR(Math.ceil((.2*inc-(inc-exp-emi))/100)*100)} more a month to reach 20%. Putting the transfer on the day salary arrives works better than saving what is left.`:null})}
  else ask('save','How much you save','your monthly income and expenses');
  if(age&&fin>0){const eq=(v('Indian equity')+v('US equity')+v('Equity funds')+.5*(v('Hybrid funds')+v('Mixed')))/fin,t=Math.max(20,Math.min(80,100-age))/100,off=eq-t;
    out.push({k:'mix',title:'Shares against safer money',level:Math.abs(off)<=.15?'good':'warn',value:pct(eq,0,false)+' in shares',
      text:`${pct(eq,0,false)} of your money outside property is in shares and equity funds. A rough guide for age ${age} is about ${pct(t,0,false)} (100 minus your age), give or take 15 points. It is a starting point, not a rule: money needed within 5 years belongs in safer places whatever your age.`,
      todo:Math.abs(off)>.15?(off<0?`Your long-term money is light on shares. Moving new savings toward equity index funds would lift it from ${pct(eq,0,false)}.`:`A large part is in shares. Check that money you need within 5 years is not among it.`):null})}
  else if(fin>0)ask('mix','Shares against safer money','your age');
  const one=(d.rows||[]).filter(r=>['Indian equity','US equity','Crypto'].includes(r.class)).sort((a,b)=>b.value-a.value)[0];
  if(one&&fin>0){const sh=one.value/fin;
    out.push({k:'one',title:'Biggest single holding',level:sh>.35?'bad':sh>.2?'warn':'good',value:pct(sh,0,false),
      text:`${one.name} is ${pct(sh,0,false)} of your money outside property. One company or coin can fall far and stay down; funds spread that risk.`,
      todo:sh>.2?`Avoid adding to ${one.name}; direct new money elsewhere until it is under 20%. Selling has tax, so new money is the cheaper fix.`:null})}
  return out}
const MH_ORDER=['debt','cash','life','health','emi','save','mix','one'];
function drawMoneyHealth(d){const el=$('#mhc');if(!el)return;const P=MHP(),K=moneyChecks(d,P),done=K.filter(x=>x.level!=='ask'),ok=done.filter(x=>x.level==='good').length;

  <p class="note">These are rules of thumb that financial planners commonly use, applied to the numbers you entered. They show what to look at first; they are not advice, and they do not know your whole situation.</p>`;
  el.querySelectorAll('[data-mh]').forEach(i=>i.onchange=()=>{const p=MHP();p[i.dataset.mh]=i.type==='checkbox'?i.checked:i.value;LS.set('zosh_me_profile',p);drawMoneyHealth(d)})}

function setupSteps(d,H){const sk=MSETUP(),P=MHP(),h=H||[];
  const mf=h.filter(x=>x.kind==='mf').length,st=h.filter(x=>x.kind!=='mf').length,A=(d.items&&d.items.assets)||[],L=(d.items&&d.items.liabilities)||[];

    const q=r.quote||{},C=r.currency_symbol||'';
    const t=(r.triggered||[]).map(x=>{
      const v=x.policy_verdict||'',c2=v==='trade'?'up':v==='demote'?'down':'';
      return `<div><b class="${c2}">${esc(x.name)}</b> <span class="sub">${esc(x.grade||'')}${x.expectancy_R!=null?` · ${Rbit(x.expectancy_R)} net`:''}${x.call?` · ${esc(x.call)}`:''}</span></div>`}).join('');
    const f=(r.forming||[]).map(x=>{
      const g=x.gap!=null?`${x.gap>0?'+':''}${num(x.gap,2)} ${esc(x.gap_unit||'')}`:esc(x.forming_text||'');
      return `<div class="sub">${esc(x.name)} — ${g}</div>`}).join('');
    return `<tr data-s="${esc(r.symbol)}" class="${r.symbol===sel?'on':''}" style="cursor:pointer">
      <td class="l"><b>${esc(r.display)}</b>${mk(r.market)}</td>
      <td><b>${C}${num(q.last,2)}</b>${r.stale?' <span class="sub" title="last quote failed">stale</span>':''}</td>
      <td class="${(q.change||0)>=0?'up':'down'}"><b>${q.change==null?'–':pct(q.change)}</b><div class="sub">prev ${num(q.previous_close,2)}</div></td>
      <td class="l">${t||(f?`<div class="sub">${(r.forming||[]).length} forming</div>`:'<span class="sub">no pattern near</span>')}${f?`<div style="margin-top:4px">${f}</div>`:''}
        ${r.provisional?'<div class="sub" style="margin-top:4px">provisional bar — may change before the close</div>':''}</td></tr>`};
  const killChart=()=>{coneSeries.forEach(s=>{try{LWC&&LWC.removeSeries(s)}catch(e){}});coneSeries=[];
    if(LWC){try{LWC.remove()}catch(e){}}LWC=null;cs=null;chartSym=null;lastBar=null};
  const drawChart=async(sym,silent)=>{
    const host=$('#lvchart');
    if(!sym){host.innerHTML='';return}
    const hz=LS.get('pd_cone_days',63);
    let d;try{d=await api(`/api/live/chart?symbol=${encodeURIComponent(sym)}&bars=160&days=${hz}&source=${encodeURIComponent(LS.get('pd_cone','analogs'))}`)}
    catch(e){host.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
    if(!window.LightweightCharts){host.innerHTML='<div class="err">Chart library could not load.</div>';return}
    const P=d.prediction||{},C=d.currency_symbol||'';
    if(!silent||chartSym!==sym){
      killChart();chartSym=sym;
      host.innerHTML=`<section class="panel"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
          <h2>${esc(d.display)} <span class="sub">${esc(d.quote&&d.quote.currency||'')}</span></h2>
          <div class="row"><span class="sub">Over</span>
            <select id="lvdays">${[[1,'1 day'],[10,'10 days'],[15,'15 days'],[21,'1 month'],[63,'3 months'],[126,'6 months'],[252,'1 year']].map(([v,l])=>`<option value="${v}" ${v===LS.get('pd_cone_days',63)?'selected':''}>${l}</option>`).join('')}</select>
            <span class="sub">built from</span>
            <select id="lvcone">${['analogs',...(d.patterns&&d.patterns.triggered||[]).map(x=>x.pattern),...(d.patterns&&d.patterns.forming||[]).map(x=>x.pattern)]
              .filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<option value="${esc(v)}" ${v===LS.get('pd_cone','analogs')?'selected':''}>${esc(v==='analogs'?'Look-alike price paths':v)}</option>`).join('')}</select></div></div>
        <div id="lvchartbox" style="height:380px"></div>
        <div id="lvpred"></div></section>`;
      $('#lvcone').onchange=e=>{LS.set('pd_cone',e.target.value);drawChart(sym,false)};
      $('#lvdays').onchange=e=>{LS.set('pd_cone_days',+e.target.value);drawChart(sym,false)};
      LWC=LightweightCharts.createChart($('#lvchartbox'),{layout:{background:{color:'transparent'},textColor:'#888'},grid:{vertLines:{visible:false},horzLines:{color:'rgba(128,128,128,.15)'}},rightPriceScale:{borderVisible:false},timeScale:{borderVisible:false},crosshair:{mode:1}});
      cs=LWC.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
      cs.setData((d.bars||[]).map(b=>({time:b.time,open:b.open,high:b.high,low:b.low,close:b.close})));
      lastBar=(d.bars||[]).slice(-1)[0]||null;
      // the prediction cone: a shaded band and a dashed median, drawn forward
      if(P.median){
        const band=(lo,hi,colour)=>[LWC.addLineSeries({color:colour,lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}),
                                    LWC.addLineSeries({color:colour,lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false})];
        const light='rgba(90,140,255,0.35)',mid='rgba(90,140,255,0.7)';
        const [b10,b90]=band();b10.setData(P.band10);b90.setData(P.band90);
        const [b25,b75]=band();b25.setData(P.band25);b75.setData(P.band75);
        const med=LWC.addLineSeries({color:'rgba(90,140,255,0.95)',lineWidth:2,lineStyle:2,priceLineVisible:false,lastValueVisible:false,title:'prediction'});
        med.setData(P.median);
        coneSeries=[b10,b90,b25,b75,med];
        LWC.timeScale().fitContent();
      }
      const o=(P.outcome)||{};
      $('#lvpred').innerHTML=P.median?`<div class="fnote" style="margin-top:10px">
        <span><b>Shaded cone:</b> what followed ${esc(P.label||P.source)} over the next <b>${P.days}</b> sessions — ${P.n} past cases, drawn forward from today's ${C}${num(d.bars.slice(-1)[0].close)}. The dashed line is the median path, the lighter lines the middle 50% and the outer 80%.</span>
        <span>On the barrier the app trades (<b>${esc(o.barrier||'')}</b>): <b class="${cls(o.expectancy_R)}">${Rbit(o.expectancy_R)}</b> per trade vs a matched control of <b>${Rbit(o.control_R)}</b> — an edge of <b class="${cls(o.edge_R)}">${Rbit(o.edge_R)}</b>${o.edge_net!=null?` (${Rbit(o.edge_net)} after costs)`:''}${o.t!=null?`, t=${num(o.t,2)}`:''}.</span>
        <span>${esc(P.verdict||'')}</span>
        <span class="sub">${esc(P.caveat||'')}</span></div>`:'<p class="sub">No usable past cases for this setup, so no cone can be drawn.</p>';
    } else if(d.bars&&d.bars.length&&cs){
      // silent update: just move the last candle
      const b=d.bars.slice(-1)[0];cs.update({time:b.time,open:b.open,high:b.high,low:b.low,close:b.close});lastBar=b;
    }
    return d;
  };
  const drawLog=async()=>{
    let L;try{L=await api('/api/live/log')}catch(e){return}
    const rows=(L.by_pattern||[]).slice(0,6).map(p=>`<tr><td class="l">${esc(p.pattern)}</td><td>${p.n}</td>
      <td class="${p.win>=0.5?'up':'down'}">${pct(p.win,0,false)}</td><td class="${p.expectancy_R>0?'up':'down'}">${Rbit(p.expectancy_R)}</td></tr>`).join('');
    $('#lvlog').innerHTML=`<section class="panel"><h2>Did the predictions come true?</h2>
      <p class="sub">Every pattern that <b>triggers</b> while you are watching is written down with the price at that moment, then graded only once the full holding period has actually elapsed — same gap-filled barrier, same matched control as the study. This is the app marking its own homework.</p>
      <div class="tiles"><div class="tile"><b>${L.total||0}</b><span>logged</span></div>
        <div class="tile"><b>${L.resolved||0}</b><span>resolved</span></div>
        <div class="tile"><b>${L.open||0}</b><span>still open</span></div>
        ${L.ready?`<div class="tile"><b class="${L.win>=0.5?'up':'down'}">${pct(L.win,0,false)}</b><span>came true</span></div>
        <div class="tile"><b class="${(L.edge_net||0)>0?'up':'down'}">${Rbit(L.edge_net)}</b><span>net edge per trade</span></div>`:''}</div>
      ${rows?`<div class="tw"><table><thead><tr><th class="l">Pattern</th><th>n</th><th>Came true</th><th>Net per trade</th></tr></thead><tbody>${rows}</tbody></table></div>`:''}
      <p class="note">${esc(L.message||'')}</p>
      <div class="row"><button id="lvresolve">Grade any that have matured</button></div></section>`;
    const b=$('#lvresolve');if(b)b.onclick=async()=>{b.disabled=true;b.textContent='Grading…';
      try{const r=await api('/api/live/log/resolve',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
        b.textContent=`Graded ${r.resolved||0}`;drawLog()}catch(e){b.textContent='Failed';b.disabled=false}};
  };
  const draw=async(force)=>{
    if(busy)return;busy=true;
    try{
      const u='/api/live?symbols='+encodeURIComponent(W.join(','))+'&interval='+up+(force?'&fresh=1':'');
      const d=await api(u);
      const s=d.summary||{},ms=d.market_state||{},f=d.feed||{};
      const openTxt=Object.entries(ms).map(([k,v])=>`${k} ${v.open?'open':'closed'}${v.local_time?' '+v.local_time:''}`).join(' · ');
      $('#lvout').innerHTML=`<section class="panel"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px">
          <h2>${s.triggered||0} triggered · ${s.forming||0} forming · ${s.quiet||0} quiet${s.errors?` · ${s.errors} unavailable`:''}</h2>
          <span class="sub">${esc(openTxt)}</span></div>
        <div class="tw"><table><thead><tr><th class="l">Stock</th><th>Price</th><th>Today</th><th class="l">Patterns right now</th></tr></thead>
        <tbody>${(d.rows||[]).map(rowHtml).join('')}</tbody></table></div>
        <p class="note">Prices refresh every ${f.effective_interval||up}s${f.last_error?` · the feed is backing off (${esc(f.last_error)})`:''}. ${esc(d.note||'')} A row with no pattern near it is the normal case.</p></section>`;
      document.querySelectorAll('#lvout tr[data-s]').forEach(tr=>tr.onclick=()=>{sel=tr.dataset.s;drawChart(sel,false);draw(true)});
      // push the freshest price straight onto the open chart, so the candle moves
      // every screen tick rather than only when the upstream feed refreshes
      const r=(d.rows||[]).find(x=>x.symbol===sel);
      if(r&&r.ok&&r.quote&&cs&&lastBar){
        const q=r.quote;
        cs.update({time:lastBar.time,open:lastBar.open,high:Math.max(lastBar.high,q.last),low:Math.min(lastBar.low,q.last),close:q.last});
      }
      if(!$('#lvchartbox')||chartSym!==sel)await drawChart(sel,false);
      if(d.logged_now)$('#lvstatus').textContent=`logged ${d.logged_now} new prediction${d.logged_now>1?'s':''} · ${d.as_of||''}`;
      else $('#lvstatus').textContent=`checked ${d.as_of||''}${f.cycles?` · cycle ${f.cycles}`:''}`;
    }catch(e){$('#lvout').innerHTML=`<div class="err">${esc(e.message)}</div>`;$('#lvstatus').textContent='failed'}
    finally{busy=false;left=secs}
  };
  const poll=()=>{clearInterval(timer);clearInterval(tick);left=secs;draw(false);drawLog();
    const gone=()=>{if($('#lvstatus'))return false;clearInterval(tick);clearInterval(timer);return true};tick=setInterval(()=>{if(gone())return;left--;if(left<=0)left=secs;if(!paused)$('#lvstatus').textContent=`screen in ${left}s`},1000);
    timer=setInterval(()=>{if(gone())return;if(!paused)draw(false)},secs*1000)};
  let paused=false;
  const addSym=()=>{const v=($('#lvadd').value||'').trim().toUpperCase();if(!v)return;
    if(!W.includes(v))W.push(v);$('#lvadd').value='';LS.set('pd_live',W);drawChips();sel=sel||v;draw(true)};
  $('#lvaddb').onclick=addSym;
  $('#lvadd').onkeydown=e=>{if(e.key==='Enter')addSym()};
  document.querySelectorAll('#lvsecs button').forEach(b=>b.onclick=()=>{secs=+b.dataset.s;LS.set('pd_live_secs',secs);
    document.querySelectorAll('#lvsecs button').forEach(x=>x.classList.toggle('on',x===b));poll()});
  document.querySelectorAll('#lvup button').forEach(b=>b.onclick=()=>{up=+b.dataset.s;LS.set('pd_live_up',up);
    document.querySelectorAll('#lvup button').forEach(x=>x.classList.toggle('on',x===b));draw(true)});
  $('#lvpause').onclick=()=>{paused=!paused;$('#lvpause').textContent=paused?'Resume':'Pause'};
  drawChips();poll();
}

function annotate(){
  if(typeof document.querySelectorAll!=='function')return;
  document.querySelectorAll('th:not([data-g]),.tile>span:not([data-g])').forEach(el=>{
    const k=glossFor(el.textContent);el.dataset.g=k||'';if(k)el.insertAdjacentHTML('beforeend',infoBtn(k))});
  document.querySelectorAll('label:not([data-g])').forEach(el=>{el.dataset.g='';const n=el.childNodes&&el.childNodes[0];
    if(!n||n.nodeType!==3)return;const k=glossFor(n.textContent);if(!k)return;el.dataset.g=k;
    const t=document.createElement('span');t.innerHTML=infoBtn(k);el.insertBefore(t.firstChild,n.nextSibling)});
  const m=document.querySelector('#main');
  if(m&&!m.querySelector('.loading')){const h=m.querySelector('h1'),t=h?(h.textContent||'').trim():'';
    const want=t?t.slice(0,70)+' · ZOSH':'ZOSH · markets & money, private by design';if(document.title!==want)document.title=want}
  if(m&&HELP_ON()&&m.children.length&&!m.querySelector('.phelp')&&!m.querySelector('.loading')&&location.hash.replace(/^#\/?/,'')!=='glossary'){
    const t=pageHelp(),hd=m.querySelector(':scope>header');if(t)(hd||m).insertAdjacentHTML(hd?'afterend':'afterbegin',`<div class="phelp"><span><b>New here?</b> ${esc(t)} <span class="phl">Tap any <span class="ib ibx">i</span> for a plain explanation, or <a href="#/glossary">read all the terms</a>.</span></span><button type="button" class="small" id="phx" title="Hide these tips on every page">Hide tips</button></div>`)}}
function showGloss(btn){const g=GLOSS[btn.dataset.k];if(!g)return;hideGloss();
  const c=document.createElement('div');c.id='gcard';c.setAttribute('role','dialog');
  c.innerHTML=`<div class="gc-h"><b>${esc(g.t)}</b><button type="button" class="small" id="gcx" aria-label="Close">Close</button></div>
    <p>${esc(g.what)}</p><p><span class="gl">Why it is here</span>${esc(g.why)}</p><p><span class="gl">How to read it</span>${esc(g.read)}</p>
    ${g.change?`<p><span class="gl">If you change it</span>${esc(g.change)}</p>`:''}<p class="sub"><a href="#/glossary">All terms explained</a></p>`;
  document.body.appendChild(c);
  const r=btn.getBoundingClientRect(),w=Math.min(340,window.innerWidth-24);c.style.width=w+'px';
  if(window.innerWidth>640){c.style.left=Math.max(12,Math.min(r.left-20,window.innerWidth-w-12))+'px';
    const below=r.bottom+8,h=c.offsetHeight;c.style.top=(below+h>window.innerHeight-8?Math.max(8,r.top-h-8):below)+'px'}
  else c.classList.add('sheet')}

    if(t&&t.id==='gcx'||!(t&&t.closest&&t.closest('#gcard')))hideGloss()},true);

      :`<div class="tile"><b>${B.measured?'measured':'not yet measured'}</b><span>${B.measured?'the range is twice the typical miss so far':'the range is a provisional ±0.25% until 20 sessions have been checked'}</span></div>`}</div>

function drawDividends(){const el=$('#dvL');if(!el||!DIVD)return;const F=DIVF;
  const inM=DIVD.rows.filter(x=>(F.mkt==='all'||x.market===F.mkt)&&x.market!=='MF'&&x.market!=='CRYPTO');
  const pay=inM.filter(x=>x.div_yield>0&&x.div_last_date);
  let rows=pay.filter(x=>(!F.min||x.div_yield>+F.min/100)&&(!F.grow||x.div_growth5>0));
  const ys=pay.map(x=>x.div_yield).sort((a,b)=>a-b),med=ys.length?ys[Math.floor(ys.length/2)]:null,top=pay.slice().sort((a,b)=>b.div_yield-a.div_yield)[0];
  $('#dvT').innerHTML=`<div class="tile"><b>${pay.length}</b><span>of ${inM.length} paid a dividend in the last 12 months</span></div>
    <div class="tile"><b>${med==null?'–':pct(med,1,false)}</b><span>dividend yield of the typical payer</span></div>
    <div class="tile"><b>${top?pct(top.div_yield,1,false):'–'}</b><span>highest dividend yield${top?' ('+esc(top.display)+')':''}</span></div>
    <div class="tile"><b>${pay.filter(x=>x.div_growth5>0).length}</b><span>raised their dividend over the last 5 years</span></div>`;
  const val=(x,k)=>k==='name'?(x.name||x.display):x[k];
  rows.sort((a,b)=>{const x=val(a,F.sort),y=val(b,F.sort);if(x==null&&y==null)return a.display.localeCompare(b.display);if(x==null)return 1;if(y==null)return -1;
    return typeof x==='string'?-F.dir*x.localeCompare(y):F.dir*(x-y)});
  const total=rows.length,cap=F.all?total:Math.min(total,100);
  const th=(k,l,t,c)=>`<th class="${c||''} sortable" data-k="${k}" title="${esc(t||'')}">${l}${F.sort===k?(F.dir<0?' ▾':' ▴'):''}</th>`;
  el.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${total} dividend payer${total===1?'':'s'}</h2><span class="sub">click a column to sort · click a row to open it</span></div>
  ${total?`<div class="tw"><table><thead><tr>${th('name','Stock','','l')}${th('close','Price')}${th('div_yield','Dividend yield')}${th('div_12m','Paid in 12 months','Cash paid per share over the last 12 months')}
    ${th('div_n12','Payments a year','Number of dividends in the last 12 months')}${th('div_last_date','Last payment','The latest dividend and its ex-dividend date')}
    ${th('div_growth5','5-year dividend growth','Yearly growth of the total dividend over the last five full years')}${th('div_years','Years paid in a row')}
    ${th('cagr_total','Yearly, with dividends','Yearly growth over its whole history with dividends reinvested')}</tr></thead><tbody>
    ${rows.slice(0,cap).map(x=>`<tr class="click" onclick="${link(x.symbol)}"><td class="l"><b>${esc(x.display)}</b><div class="sub">${esc(x.name&&x.name!==x.display?x.name:'')}</div></td>
      <td>${esc(x.currency||'')}${num(x.close)}</td><td><b>${pct(x.div_yield,1,false)}</b></td><td>${esc(x.currency||'')}${num(x.div_12m)}</td><td>${x.div_n12||'–'}</td>
      <td>${esc(x.currency||'')}${num(x.div_last)}<div class="sub">${esc(x.div_last_date)}</div></td><td class="${cls(x.div_growth5)}">${x.div_growth5==null?'–':pct(x.div_growth5,1)}</td>
      <td>${x.div_years||'–'}</td><td class="${cls(x.cagr_total)}">${x.cagr_total==null?'–':pct(x.cagr_total,1,false)}</td></tr>`).join('')}
    </tbody></table></div>${cap<total?`<div class="row" style="margin-top:10px"><button id="dvall">Show all ${total}</button><span class="sub">showing the first ${cap}</span></div>`:''}
    <p class="note">A yield far above the others usually means the share price has fallen sharply or a one-time special dividend was paid, not that the income is safe. Dividends are taxed as income at your slab rate in India.</p>`
   :'<div class="empty">Nothing matches. Loosen the filters.</div>'}`;
  el.querySelectorAll('th.sortable').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(F.sort===k)F.dir=-F.dir;else{F.sort=k;F.dir=k==='name'?1:-1}drawDividends()});
  const sa=$('#dvall');if(sa)sa.onclick=()=>{F.all=true;drawDividends()};
  const cut=new Date(new Date((DIVD.generated||'').slice(0,10)||Date.now()).getTime()-45*864e5).toISOString().slice(0,10);
  const recent=pay.filter(x=>x.div_last_date>=cut).sort((a,b)=>b.div_last_date.localeCompare(a.div_last_date)).slice(0,12);
  $('#dvR').innerHTML=`<h2>Paid in the last 45 days</h2>${recent.length?`<div class="tw"><table><thead><tr><th class="l">Stock</th><th>Ex-dividend date</th><th>Amount a share</th><th>Dividend yield</th></tr></thead><tbody>

    :'<div class="empty">No dividends in the last 45 days in this market.</div>'}`}

async function globalRE(host,D){let FX={rates:{},drift10y:{}};try{FX=await api('/api/fx')}catch(e){}
  const rate=c=>c==='INR'?1:FX.rates?.[c]??null;
  host.innerHTML=`<section class="panel"><div class="row" style="justify-content:space-between"><h2>Around the world</h2><div class="seg" id="gsort">${[['yo','Best rental yield'],['g','Price growth'],['pr','Cheapest vs rent']].map(([k,l],i)=>`<button data-k="${k}" class="${i?'':'on'}">${l}</button>`).join('')}</div></div>
    <p class="sub">How cities compare as places to own a rental flat. Yields and price-to-rent come from Numbeo's crowd-sourced data (read 2 Oct 2026); price growth is the country's last 12 months from Knight Frank's Global House Price Index (Q3 2025). Price-to-rent = years of rent to pay the price.</p>
    <div class="tw"><table id="gtab"></table></div><p class="note">Buying and foreign-ownership rules are a short summary and change often; check with a local lawyer before buying. Dubai and Bangkok have no Knight Frank country figure.</p></section>
  <section class="panel"><h2>Buy a flat abroad: what's left in rupees?</h2>
    <p class="sub">Indian residents can send up to $250,000 a person each financial year under the Liberalised Remittance Scheme (LRS). Above ₹10 lakh a year, 20% TCS is collected (you get it back as a tax credit). Indian loans can't fund it. India taxes the rent and the gain (12.5% after 24 months), with credit for foreign tax, and the property must be declared in Schedule FA every year.</p>
    <div class="form"><label class="sub">City<select id="ba_c">${CITIES.filter(x=>x.k!=='India').map((x,i)=>`<option value="${i}" ${x.c==(D.ba_c||'Dubai')?'selected':''}>${esc(x.c)}</option>`).join('')}</select></label>
      <label class="sub">Price (local currency)<input id="ba_p" type="number" value="${D.ba_p||1500000}"></label>
      <label class="sub">Rupees per unit<input id="ba_fx" type="number" step="0.0001" value=""></label>
      <label class="sub">Paid from savings %<input id="ba_dp" type="number" value="${D.ba_dp??100}"></label>
      <label class="sub">Local loan rate %<input id="ba_lr" type="number" step="0.1" value="${D.ba_lr??6}"></label>
      <label class="sub">Gross rent %/yr<input id="ba_y" type="number" step="0.1"></label>
      <label class="sub">Running costs %/yr<input id="ba_rc" type="number" step="0.1" value="${D.ba_rc??1.5}"></label>
      <label class="sub">Local tax on rent %<input id="ba_lt" type="number" step="1"></label>
      <label class="sub">Price rise %/yr<input id="ba_g" type="number" step="0.5"></label>
      <label class="sub">Currency vs ₹ %/yr<input id="ba_cv" type="number" step="0.1"></label>
      <label class="sub">Buying costs %<input id="ba_bc" type="number" step="0.5"></label>
      <label class="sub">Years<input id="ba_n" type="number" value="${D.ba_n||10}"></label>
      <label class="sub">Your slab %<input id="ba_s" type="number" value="${D.ba_s??30}"></label>
      <label class="sub">Or index fund at %/yr<input id="ba_alt" type="number" step="0.5" value="${D.ba_alt??11}"></label></div>
    <div id="ba_out"></div></section>`;
  let sortK='yo';const drawT=()=>{const L=CITIES.slice().sort((a,b)=>sortK==='pr'?a.pr-b.pr:((b[sortK]??-99)-(a[sortK]??-99)));
    $('#gtab').innerHTML=`<thead><tr><th class="l">City</th><th>Rental yield</th><th>Price to rent</th><th>Price to income</th><th>Price growth (12m)</th><th>Buying costs</th></tr></thead><tbody>${L.map(x=>`<tr><td class="l"><b>${esc(x.c)}</b><div class="sub">${esc(x.k)} · ${esc(x.cur)}${rate(x.cur)&&x.cur!=='INR'?` · ₹${num(rate(x.cur),x.cur==='JPY'?3:2)}`:''}</div></td><td><b>${num(x.yc,1)}%</b><div class="sub">${num(x.yo,1)}% outside centre</div></td><td>${num(x.pr,1)}</td><td>${num(x.pi,1)}</td><td class="${cls(x.g)}">${x.g==null?'–':pct(x.g/100,1)}</td><td>~${x.cost}%</td></tr><tr class="flagrow"><td colspan="6" class="l sub">${esc(x.rule)} ${esc(x.tax)}</td></tr>`).join('')}</tbody>`};
  document.querySelectorAll('#gsort button').forEach(b=>b.onclick=()=>{sortK=b.dataset.k;document.querySelectorAll('#gsort button').forEach(x=>x.classList.toggle('on',x===b));drawT()});drawT();
  const fill=()=>{const x=CITIES.filter(c=>c.k!=='India')[+$('#ba_c').value];$('#ba_fx').value=rate(x.cur)??'';$('#ba_y').value=x.yo;$('#ba_g').value=x.g??5;$('#ba_bc').value=Math.min(x.cost,70);
    $('#ba_lt').value={UAE:0,UK:20,Singapore:24,USA:25,Canada:25,Australia:30,Portugal:25,Germany:15,Japan:20,Thailand:15,Malaysia:30}[x.k]??20;$('#ba_cv').value=((FX.drift10y?.[x.cur]??0.03)*100).toFixed(1)};
  const calc=()=>{const v=id=>+$('#'+id).value||0;const fxr=v('ba_fx');if(!fxr){$('#ba_out').innerHTML='<div class="err">Enter how many rupees one unit of that currency costs.</div>';return}
    const x=CITIES.filter(c=>c.k!=='India')[+$('#ba_c').value];LS.set('pd_re',{...LS.get('pd_re',{}),ba_c:x.c,ba_p:v('ba_p'),ba_dp:v('ba_dp'),ba_lr:v('ba_lr'),ba_rc:v('ba_rc'),ba_n:v('ba_n'),ba_s:v('ba_s'),ba_alt:v('ba_alt')});
    const P=v('ba_p'),n=Math.max(1,Math.round(v('ba_n'))),dp=Math.min(100,v('ba_dp'))/100,lr=v('ba_lr')/100,g=v('ba_g')/100,cv=v('ba_cv')/100,y=v('ba_y')/100,rc=v('ba_rc')/100,lt=v('ba_lt')/100,bc=v('ba_bc')/100,sl=v('ba_s')/100,alt=v('ba_alt')/100;
    const loan=P*(1-dp),upLocal=P*dp+P*bc,upINR=upLocal*fxr,tcs=Math.max(0,upINR-1e6)*0.2;const usd=fxr/(rate('USD')||fxr);const lrsCap=250000*(rate('USD')||0);
    let value=P,bal=loan,fx=fxr,cash=0,cashINR=0;const emi=loan?loan*lr/(1-Math.pow(1+lr,-20)):0;
    for(let i=1;i<=n;i++){const rent=value*y,costs=value*rc,interest=bal*lr;const pre=rent-costs-interest;const ftax=Math.max(0,rent-costs)*lt;
      fx*=1+cv;const inrRent=(rent-costs)*fx;const itax=Math.max(0,inrRent*0.7*sl-ftax*fx);const net=(pre-ftax)*fx-itax-(loan?(emi-interest)*fx:0);cashINR=cashINR*(1+alt)+net;
      bal=Math.max(0,bal-(emi-interest));value*=1+g}
    const saleLocal=value*(1-0.02)-bal,saleINR=saleLocal*fx,costINR=upINR+(loan?loan*fxr:0)*0;const gainINR=value*0.98*fx-(P*(1+bc))*fxr;const cgt=Math.max(0,gainINR)*(n>2?0.125:sl)*1.04;
    const endINR=saleINR-cgt+cashINR,altINR=upINR*Math.pow(1+alt,n)-Math.max(0,upINR*Math.pow(1+alt,n)-upINR)*0.125*1.04;const irr=Math.pow(Math.max(endINR,1)/upINR,1/n)-1;
    $('#ba_out').innerHTML=`<div class="tiles"><div class="tile"><b>${LAKH(upINR)}</b><span>rupees to send (${num(dp*100,0)}% of price + ${num(bc*100,1)}% buying costs)</span></div>
      <div class="tile"><b class="${upINR>lrsCap?'down':''}">${!lrsCap?'–':upINR>lrsCap?Math.ceil(upINR/lrsCap)+' LRS years':'1 LRS year'}</b><span>LRS allows $250k${lrsCap?` (≈ ${LAKH(lrsCap)})`:''} per person a year: spread it over years or add co-owners</span></div>
      <div class="tile"><b>${LAKH(tcs)}</b><span>TCS collected up front (20% above ₹10 L; refunded as a tax credit)</span></div>
      <div class="tile"><b class="${endINR>=altINR?'up':'down'}">${LAKH(endINR)}</b><span>in rupees after ${n} years: sale after loan, costs and Indian tax, plus rent saved at ${num(alt*100,0)}%</span></div>
      <div class="tile"><b>${LAKH(altINR)}</b><span>the same rupees in an index fund at ${num(alt*100,0)}% (after 12.5% tax)</span></div>
      <div class="tile"><b class="${cls(irr)}">${pct(irr,1)}</b><span>yearly return in rupees (rough)</span></div></div>
      <p class="note">Rough model: rent net of running costs and local tax, Indian tax at your slab after the 30% deduction with credit for local tax, loan (if any) from a local lender over 20 years, 2% selling cost, Indian 12.5% tax on the rupee gain after 24 months. Currency move ${pct(cv,1)} a year ${FX.drift10y?.[x.cur]!=null?'= the last 10 years’ average vs the rupee':'(assumed)'}. Not modelled: local capital gains tax, vacancies, repairs, inheritance rules.</p>`};
  $('#ba_c').onchange=()=>{fill();calc()};document.querySelectorAll('[id^=ba_]').forEach(e=>{if(e.id!=='ba_c')e.oninput=calc});fill();calc()}
